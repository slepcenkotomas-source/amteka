                                <th className="text-center px-1 py-2.5" style={{width:32}}>Nr.</th>
                                <th className="text-left px-2 py-2.5" style={{width:220}}>Prekės pavadinimas *</th>
                                <th className="text-left px-2 py-2.5" style={{width:150}}>Tiekėjas</th>
                                <th className="text-center px-1 py-2.5" style={{width:70}}>Mato vnt.</th>
                                <th className="text-right px-1 py-2.5" style={{width:72}}>Kiekis</th>
                                <th className="text-left px-2 py-2.5" style={{width:150}}>Pristatymo adresas</th>
                                <th className="text-left px-2 py-2.5" style={{width:148}}>Žin. grupė</th>
                                <th className="text-left px-2 py-2.5" style={{width:160}}>Žin. eilutė</th>
                                <th style={{width:24}}></th>
                              </tr>
                            </thead>
                            <tbody>
                              {orderRows.map((r,ri)=>{
                                const rowMemSup = memProducts[r.name]?.suppliers||[];
                                const allSupOpts = [...new Set([...memSuppliers,...rowMemSup])];
                                return (
                                  <tr key={r.id} style={{background:ri%2===0?"#fff":"#f9fafb",height:42}}>
                                    <td className="text-center px-1 text-gray-400">{ri+1}</td>
                                    <td className="px-1 py-1">
                                      <ComboInput value={r.name} onChange={v=>updateOrderRow(r.id,"name",v)} options={memProductNames} placeholder="Pavadinimas..."/>
                                    </td>
                                    <td className="px-1 py-1">
                                      <ComboInput value={r.supplier} onChange={v=>updateOrderRow(r.id,"supplier",v)} options={allSupOpts} placeholder={formSupplier||"Tiekėjas..."}/>
                                    </td>
                                    <td className="px-1 py-1">
                                      <input className="w-full border rounded px-1 py-1 text-xs text-center" value={r.unit} onChange={e=>updateOrderRow(r.id,"unit",e.target.value)}/>
                                    </td>
                                    <td className="px-1 py-1">
                                      <input type="number" min="0" step="0.01" className="w-full border rounded px-1 py-1 text-xs text-right" value={r.qty} onChange={e=>updateOrderRow(r.id,"qty",e.target.value)}/>
                                    </td>
                                    <td className="px-1 py-1">
                                      <ComboInput value={r.address} onChange={v=>updateOrderRow(r.id,"address",v)} options={memAddresses} placeholder={formAddress||"Adresas..."}/>
                                    </td>
                                    <td className="px-1 py-1">
                                      <select className="w-full border rounded px-1 py-1 text-xs bg-white" value={r.zinGroupId||""} onChange={e=>updateOrderRow(r.id,"zinGroupId",e.target.value)}>
                                        <option value="">— Grupė —</option>
                                        {allZinGroups.map(g=><option key={g.id} value={g.id}>{g.groupName}</option>)}
                                      </select>
                                    </td>
                                    <td className="px-1 py-1">
                                      <select className="w-full border rounded px-1 py-1 text-xs bg-white" value={r.zinItemId||""} onChange={e=>updateOrderRow(r.id,"zinItemId",e.target.value)} disabled={!r.zinGroupId}>
                                        <option value="">— Eilutė —</option>
                                        {r.zinGroupId&&(allZinGroups.find(g=>g.id==r.zinGroupId)||{items:[]}).items.map(it=><option key={it.id} value={it.id}>{it.name}</option>)}
                                      </select>
                                    </td>
                                    <td className="px-1 text-center">
                                      {orderRows.length>1&&<button onClick={()=>removeOrderRow(r.id)} className="text-red-400 hover:text-ral3000 font-bold">✕</button>}
                                    </td>
                                  </tr>
                                );
                              })}
                            </tbody>
                          </table>
                        </div>
                      </div>
                      {memProductNames.length>0 && (
                        <div className="mt-1.5 text-xs text-gray-400 flex-shrink-0">
                          💡 Atmintyje: {memProductNames.length} prekė(-s), {memSuppliers.length} tiekėjas(-ai) — pradėjus rašyti siūlomi variantai.
                        </div>
                      )}
                    </div>
                    {/* Mygtukai apačioje */}
                    <div className="flex gap-2 px-6 py-4 border-t border-gray-100 flex-shrink-0 mt-2">
                      <button onClick={saveOrder} className="flex-1 bg-ral3000 hover:bg-orange-700 text-white rounded-xl py-2.5 font-bold text-sm">
                        {modalMode==="edit"?"✓ Išsaugoti pakeitimus":"✓ Sukurti užsakymą"}
                      </button>
                      <button onClick={closeModal} className="px-6 bg-stone-100 hover:bg-gray-200 text-gray-600 rounded-xl py-2.5 font-semibold text-sm">Atšaukti</button>
                    </div>
                  </div>
                </div>
              )}

              {/* ══ PRISTATYMO MODALAS ══ */}
              {showDelivery && (
                <div className="fixed inset-0 flex items-center justify-center z-50" style={{background:"rgba(0,0,0,0.4)"}}>
                  <div className="bg-white rounded-2xl shadow-2xl p-6 w-full mx-4 overflow-y-auto" style={{maxWidth:640,maxHeight:"94vh"}}>
                    <div className="flex justify-between items-center mb-4">
                      <h3 className="font-bold text-lg text-gray-800">🚚 {showDelivery.deliveryId?"Redaguoti pristatymą":"Naujas pristatymas"}</h3>
                      <button onClick={()=>setShowDelivery(null)} className="text-gray-400 hover:text-gray-700 text-2xl">×</button>
                    </div>
                    <div className="space-y-4">
                      <div className="flex gap-3">
                        <div className="flex-1">
                          <label className="block text-xs font-semibold text-gray-600 mb-1">Pristatymo data</label>
                          <input type="date" className="w-full border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-ral3000-light" value={deliveryForm.date} onChange={e=>setDeliveryForm({...deliveryForm,date:e.target.value})}/>
                        </div>
                        <div className="flex-1">
                          <label className="block text-xs font-semibold text-gray-600 mb-1">Pastabos / Važtaraščio nr.</label>
                          <input className="w-full border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-ral3000-light" value={deliveryForm.note} onChange={e=>setDeliveryForm({...deliveryForm,note:e.target.value})} placeholder="VZ-2026-001..."/>
                        </div>
                      </div>
                      <div>
                        <label className="block text-xs font-semibold text-gray-600 mb-1">📎 Važtaraščiai (jpeg, png, pdf)</label>
                        <div className="border-2 border-dashed border-blue-200 rounded-xl p-3 text-center hover:border-ral3000 transition-colors">
                          <input type="file" accept="image/*,.pdf" multiple className="hidden" id="att-upload" onChange={e=>handleAttachmentUpload(e.target.files)}/>
                          <label htmlFor="att-upload" className="cursor-pointer text-sm text-ral3000">📁 Spausti arba nutempti failus čia</label>
                        </div>
                        {(deliveryForm.attachments||[]).length>0 && (
                          <div className="flex flex-wrap gap-2 mt-2">
                            {(deliveryForm.attachments||[]).map((att,ai)=>(
                              <div key={ai} className="flex items-center gap-1 bg-ral3000-subtle border border-blue-200 rounded-lg px-2 py-1 text-xs">
                                <span className="text-ral3000">{att.type&&att.type.startsWith("image/")?"🖼":"📄"} {att.name.length>16?att.name.substring(0,16)+"...":att.name}</span>
                                <button onClick={()=>setPreviewFile(att)} className="text-ral7012 hover:text-ral3000 ml-1">👁</button>
                                <button onClick={()=>setDeliveryForm(f=>({...f,attachments:(f.attachments||[]).filter((_,i)=>i!==ai)}))} className="text-red-400 hover:text-ral3000 ml-1">✕</button>
                              </div>
                            ))}
                          </div>
                        )}
                      </div>
                      <div>
                        <label className="block text-xs font-semibold text-gray-600 mb-2">📦 Pristatyti kiekiai</label>
                        <div className="border border-gray-200 rounded-xl overflow-hidden">
                          <table className="w-full text-sm">
                            <thead className="bg-stone-50 text-xs text-gray-500 border-b border-gray-200">
                              <tr>
                                <th className="text-left px-3 py-2">Pozicija</th>
                                <th className="text-center px-2 py-2 w-14">Vnt.</th>
                                <th className="text-right px-2 py-2 w-20">Užsak.</th>
                                <th className="text-right px-2 py-2 w-20">Jau pristat.</th>
                                <th className="text-right px-2 py-2 w-28">Šis pristat.</th>
                              </tr>
                            </thead>
                            <tbody>
                              {(deliveryForm.items||[]).map((it,ii)=>{
                                const row=(activeOrder?activeOrder.rows:[]).find(r=>r.id===it.rowId);
                                const alreadyDel = row ? getRowDelivered(activeOrder,row.id) - (showDelivery.deliveryId?(()=>{
                                  const ex=(activeOrder.deliveries||[]).find(d=>d.id===showDelivery.deliveryId);
                                  const exi=ex?(ex.items||[]).find(i=>i.rowId===it.rowId):null;
                                  return exi?parseFloat(exi.qty)||0:0;
                                })():0) : 0;
                                return (
                                  <tr key={it.rowId} className={ii%2===0?"":"bg-stone-50"}>
                                    <td className="px-3 py-2 font-medium text-gray-700">{it.rowName}</td>
                                    <td className="text-center px-2 py-2 text-gray-400 text-xs">{it.unit}</td>
                                    <td className="text-right px-2 py-2 text-gray-500">{row?row.qty:"—"}</td>
                                    <td className="text-right px-2 py-2 text-orange-600 font-semibold">{alreadyDel}</td>
                                    <td className="px-2 py-2">
                                      <input type="number" min="0" step="0.01" className="w-full border rounded-lg px-2 py-1 text-sm text-right focus:outline-none focus:ring-2 focus:ring-ral3000-light" value={it.qty} onChange={e=>setDeliveryForm(f=>({...f,items:f.items.map((x,xi)=>xi===ii?{...x,qty:e.target.value}:x)}))}/>
                                    </td>
                                  </tr>
                                );
                              })}
                            </tbody>
                          </table>
                        </div>
                      </div>
                      <div className="flex gap-2 pt-2">
                        <button onClick={saveDelivery} className="flex-1 bg-ral3000 hover:bg-ral3000 text-white rounded-xl py-2.5 font-bold">✓ Išsaugoti pristatymą</button>
                        <button onClick={()=>setShowDelivery(null)} className="px-6 bg-stone-100 hover:bg-gray-200 text-gray-600 rounded-xl py-2.5 font-semibold">Atšaukti</button>
                      </div>
                    </div>
                  </div>
                </div>
              )}

              {/* ══ FAILO PERŽIŪRA ══ */}
              {previewFile && (
                <div className="fixed inset-0 flex items-center justify-center z-[60]" style={{background:"rgba(0,0,0,0.7)"}} onClick={()=>setPreviewFile(null)}>
                  <div className="bg-white rounded-2xl shadow-2xl p-4 mx-4 overflow-auto" style={{maxWidth:"90vw",maxHeight:"90vh"}} onClick={e=>e.stopPropagation()}>
                    <div className="flex justify-between items-center mb-3">
                      <span className="font-bold text-gray-800">{previewFile.name}</span>
                      <button onClick={()=>setPreviewFile(null)} className="text-gray-400 hover:text-gray-700 text-2xl leading-none">×</button>
                    </div>
                    {previewFile.type&&previewFile.type.startsWith("image/") ? (
                      <img src={previewFile.data} alt={previewFile.name} style={{maxWidth:"80vw",maxHeight:"75vh",objectFit:"contain"}} className="rounded-xl"/>
                    ) : previewFile.type==="application/pdf" ? (
                      <iframe src={previewFile.data} title={previewFile.name} style={{width:"75vw",height:"75vh"}} className="rounded-xl border border-gray-200"/>
                    ) : (
                      <div className="text-center py-8 text-gray-500">Šio failo peržiūra nepalaikoma.</div>
                    )}
                  </div>
                </div>
              )}
            </div>
          );
        }
        // ══════════════════════════════════════════════════════════
        function ZiniarastisView({ ziniarastis, setZiniarastis, materialsCatalog, setMaterialsCatalog, projectTitle }) {
          const [tab, setTab] = React.useState("ziniarastis");
          const [showAddGroup, setShowAddGroup] = React.useState(false);
          const [newGroupName, setNewGroupName] = React.useState("");
          const [showAddItem, setShowAddItem] = React.useState(null);
          const [newItem, setNewItem] = React.useState({ name:"", unit:"vnt.", qty:"", price:"" });
          const [editItem, setEditItem] = React.useState(null);
          const [showAddCatalog, setShowAddCatalog] = React.useState(false);
          const [newCatalog, setNewCatalog] = React.useState({ code:"", name:"", unit:"vnt.", qty:"", price:"" });
          const [editCatalog, setEditCatalog] = React.useState(null);
          // Grupės pagal nutylėjimą suskleistos: expanded objekte tik true reikšmės rodo išskleistas grupes.
          const [expanded, setExpanded] = React.useState({});

          const sum = (qty, price) => ((parseFloat(qty)||0)*(parseFloat(price)||0)).toFixed(2);

          function addGroup() {
            if (!newGroupName.trim()) return;
            setZiniarastis([...ziniarastis, { id: Date.now(), groupName: newGroupName.trim(), items:[] }]);
            setNewGroupName(""); setShowAddGroup(false);
          }
          function addItem(gId) {
            if (!newItem.name.trim()) return;
            const item = { id: Date.now(), name:newItem.name, unit:newItem.unit, qty:parseFloat(newItem.qty)||0, price:parseFloat(newItem.price)||0 };
            setZiniarastis(ziniarastis.map(g => g.id===gId ? {...g, items:[...(g.items||[]),item]} : g));
            setNewItem({ name:"", unit:"vnt.", qty:"", price:"" }); setShowAddItem(null);
          }
          function saveItem(gId, iId) {
            if (!editItem) return;
            setZiniarastis(ziniarastis.map(g => g.id===gId ? {...g, items:(g.items||[]).map(it => it.id===iId ? {...it,...editItem,qty:parseFloat(editItem.qty)||0,price:parseFloat(editItem.price)||0} : it)} : g));
            setEditItem(null);
          }
          function delItem(gId, iId) {
            setZiniarastis(ziniarastis.map(g => g.id===gId ? {...g, items:(g.items||[]).filter(it=>it.id!==iId)} : g));
            setEditItem(null);
          }
          function delGroup(gId) {
            if (!window.confirm("Ištrinti grupę?")) return;
            setZiniarastis(ziniarastis.filter(g=>g.id!==gId));
          }
          function addFromCatalog(gId, cat) {
            const item = { id: Date.now(), name:cat.name, unit:cat.unit, qty:cat.qty, price:cat.price };
            setZiniarastis(ziniarastis.map(g => g.id===gId ? {...g, items:[...(g.items||[]),item]} : g));
          }
          function addCatalogItem() {
            if (!newCatalog.name.trim()) return;
            setMaterialsCatalog([...materialsCatalog, { id:Date.now(), ...newCatalog, qty:parseFloat(newCatalog.qty)||0, price:parseFloat(newCatalog.price)||0 }]);
            setNewCatalog({ code:"", name:"", unit:"vnt.", qty:"", price:"" }); setShowAddCatalog(false);
          }

          function exportExcel() {
            if (!window.XLSX) return;
            const XL=window.XLSX; const wb=XL.utils.book_new();
            const rows=[["Grupė","Pozicija","Mato vnt.","Kiekis","Vnt. kaina","Suma be PVM"]];
            let total=0;
            ziniarastis.forEach(g => {
              (g.items||[]).forEach(it => { const s=(it.qty||0)*(it.price||0); total+=s; rows.push([g.groupName,it.name,it.unit,it.qty||0,it.price||0,+s.toFixed(2)]); });
              const gs=(g.items||[]).reduce((a,it)=>a+(it.qty||0)*(it.price||0),0);
              rows.push(["","Grupė iš viso:","","","",+gs.toFixed(2)]);
            });
            rows.push(["","VISO:","","","",+total.toFixed(2)]);
            const ws=XL.utils.aoa_to_sheet(rows);
            ws["!cols"]=[{wch:30},{wch:40},{wch:12},{wch:12},{wch:18},{wch:18}];
            XL.utils.book_append_sheet(wb,ws,"Žiniaraštis");
            XL.writeFile(wb,(projectTitle||"Objektas").replace(/[^\w]/g,"_")+"_Ziniarastis.xlsx");
          }

          const totalAll = ziniarastis.reduce((a,g)=>a+(g.items||[]).reduce((b,it)=>b+(it.qty||0)*(it.price||0),0),0);

          return (
            <div className="bg-white rounded-xl shadow p-4">
              <div className="flex items-center justify-between mb-4">
                <h2 className="text-xl font-bold text-gray-800">Žiniaraštis — {projectTitle}</h2>
                <button onClick={exportExcel} className="px-3 py-1.5 rounded-lg bg-green-100 hover:bg-green-200 text-ral7012-dark text-sm font-semibold">📊 Excel</button>
              </div>
              <div className="flex gap-1 mb-4 bg-stone-100 rounded-xl p-1 w-fit">
                <button onClick={()=>setTab("ziniarastis")} className={"px-4 py-1.5 rounded-lg text-sm font-semibold transition-all "+(tab==="ziniarastis"?"bg-white shadow text-ral3000":"text-gray-500")}>Žiniaraštis</button>
                <button onClick={()=>setTab("katalogas")} className={"px-4 py-1.5 rounded-lg text-sm font-semibold transition-all "+(tab==="katalogas"?"bg-white shadow text-ral3000":"text-gray-500")}>Medžiagų katalogas</button>
              </div>

              {tab === "ziniarastis" && (
                <div>
                  <button onClick={()=>setShowAddGroup(true)} className="mb-4 px-3 py-1.5 rounded-lg bg-ral3000-subtle hover:bg-blue-200 text-ral3000 text-sm font-semibold">+ Nauja grupė</button>
                  {showAddGroup && (
                    <div className="mb-4 bg-ral3000-subtle border border-blue-200 rounded-xl p-3 flex gap-2 items-end">
                      <div className="flex-1">
                        <label className="block text-xs font-semibold text-gray-600 mb-1">Grupės pavadinimas</label>
                        <input className="w-full border rounded-lg px-3 py-2 text-sm" value={newGroupName} onChange={e=>setNewGroupName(e.target.value)} autoFocus onKeyDown={e=>e.key==="Enter"&&addGroup()} />
                      </div>
                      <button onClick={addGroup} className="px-4 py-2 bg-ral3000 text-white rounded-lg text-sm font-semibold">Pridėti</button>
                      <button onClick={()=>setShowAddGroup(false)} className="px-3 py-2 bg-stone-100 text-gray-600 rounded-lg text-sm">Atšaukti</button>
                    </div>
                  )}
                  {ziniarastis.length === 0 && <p className="text-gray-400 text-center py-8">Žiniaraštis tuščias. Pridėkite grupę.</p>}
                  {ziniarastis.map(grp => {
                    const grpSum = (grp.items||[]).reduce((a,it)=>a+(it.qty||0)*(it.price||0),0);
                    // Dabar tikriname, ar expanded[grp.id] === true (išskleista). Pagal nutylėjimą false.
                    const isExp = expanded[grp.id] === true;
                    return (
                      <div key={grp.id} className="mb-4 border border-gray-200 rounded-xl overflow-hidden">
                        <div className="flex items-center gap-2 bg-stone-50 px-4 py-2 border-b border-gray-200">
                          <button onClick={()=>setExpanded({...expanded, [grp.id]: !isExp})} className="text-gray-400 font-bold w-4">{isExp ? "▼" : "▶"}</button>
                          <span className="font-bold text-gray-800 flex-1">{grp.groupName}</span>
                          <span className="text-sm text-gray-500">{(grp.items||[]).length} poz.</span>
                          <span className="text-sm font-bold text-ral7012-dark">{grpSum.toFixed(2)} €</span>
                          <button onClick={()=>setShowAddItem(grp.id)} className="px-2 py-0.5 rounded bg-green-100 hover:bg-green-200 text-ral7012-dark text-xs font-semibold">+ Pozicija</button>
                          {materialsCatalog.length > 0 && (
                            <select className="text-xs border rounded px-1 py-0.5 bg-white" defaultValue="" onChange={e=>{if(e.target.value){const cat=materialsCatalog.find(c=>c.id==e.target.value);if(cat)addFromCatalog(grp.id,cat);e.target.value=""}}}>
                              <option value="">+ Iš katalogo</option>
                              {materialsCatalog.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}
                            </select>
                          )}
                          <button onClick={()=>delGroup(grp.id)} className="text-red-400 hover:text-ral3000 text-xs px-1">🗑</button>
                        </div>
                        {isExp && (
                          <div>
                            {showAddItem===grp.id && (
                              <div className="bg-green-50 border-b border-green-200 p-3 flex gap-2 flex-wrap items-end">
                                <div className="flex-1 min-w-32"><label className="block text-xs text-gray-600 mb-0.5">Pavadinimas *</label><input className="w-full border rounded px-2 py-1 text-sm" value={newItem.name} onChange={e=>setNewItem({...newItem,name:e.target.value})} autoFocus /></div>
                                <div className="w-20"><label className="block text-xs text-gray-600 mb-0.5">Mato vnt.</label><input className="w-full border rounded px-2 py-1 text-sm" value={newItem.unit} onChange={e=>setNewItem({...newItem,unit:e.target.value})} /></div>
                                <div className="w-24"><label className="block text-xs text-gray-600 mb-0.5">Kiekis</label><input type="number" min="0" step="0.01" className="w-full border rounded px-2 py-1 text-sm" value={newItem.qty} onChange={e=>setNewItem({...newItem,qty:e.target.value})} /></div>
                                <div className="w-28"><label className="block text-xs text-gray-600 mb-0.5">Vnt. kaina be PVM</label><input type="number" min="0" step="0.01" className="w-full border rounded px-2 py-1 text-sm" value={newItem.price} onChange={e=>setNewItem({...newItem,price:e.target.value})} /></div>
                                <div className="w-24 text-sm font-bold text-gray-700 self-end pb-1">= {sum(newItem.qty,newItem.price)} €</div>
                                <button onClick={()=>addItem(grp.id)} className="px-3 py-1.5 bg-ral7012 text-white rounded-lg text-sm font-semibold self-end">Pridėti</button>
                                <button onClick={()=>setShowAddItem(null)} className="px-2 py-1.5 bg-stone-100 text-gray-600 rounded-lg text-sm self-end">✕</button>
                              </div>
                            )}
                            <table className="w-full text-sm">
                              <thead className="bg-stone-50 text-xs text-gray-500 border-b border-gray-200">
                                <tr>
                                  <th className="text-left px-4 py-2">Pavadinimas</th>
                                  <th className="text-center px-2 py-2 w-20">Vnt.</th>
                                  <th className="text-right px-2 py-2 w-24">Kiekis</th>
                                  <th className="text-right px-2 py-2 w-28">Vnt. kaina</th>
                                  <th className="text-right px-2 py-2 w-28">Suma be PVM</th>
                                  <th className="w-12"></th>
                                </tr>
                              </thead>
                              <tbody>
                                {(grp.items||[]).length===0 && <tr><td colSpan="6" className="text-center text-gray-400 py-4 text-xs">Nėra pozicijų</td></tr>}
                                {(grp.items||[]).map((it,ii)=>(
                                  <tr key={it.id} className={ii%2===0?"":"bg-stone-50"}>
                                    {editItem&&editItem.groupId===grp.id&&editItem.itemId===it.id ? (
                                      <>
                                        <td className="px-2 py-1"><input className="w-full border rounded px-2 py-1 text-xs" value={editItem.name} onChange={e=>setEditItem({...editItem,name:e.target.value})} /></td>
                                        <td className="px-2 py-1"><input className="w-full border rounded px-2 py-1 text-xs" value={editItem.unit} onChange={e=>setEditItem({...editItem,unit:e.target.value})} /></td>

                      <div className="w-24"><label className="block text-xs text-gray-600 mb-0.5">Kiekis</label><input type="number" min="0" step="0.01" className="w-full border rounded px-2 py-1 text-sm" value={newCatalog.qty} onChange={e=>setNewCatalog({...newCatalog,qty:e.target.value})} /></div>

        // =================== UŽIMTUMAS ===================
        function UzimtumasView({ allWorkers, brigades, groups, ziniarastis, todayStr, calcWorkerMonth, getMonthDays, getWeekDays, getWeekLabel, shiftWeek, activeProject }) {
          const MNS = ["Sau","Vas","Kov","Bal","Geg","Bir","Lie","Rgp","Rgs","Spa","Lap","Gruo"];
          const MNF = ["Sausis","Vasaris","Kovas","Balandis","Gegužė","Birželis","Liepa","Rugpjūtis","Rugsėjis","Spalis","Lapkritis","Gruodis"];
          const DOW = ["S","P","A","T","K","P","Š"];

          const [selWorkerId, setSelWorkerId] = React.useState(null);
          const [viewMode, setViewMode] = React.useState("month");
          const [curMonth, setCurMonth] = React.useState(() => { const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"); });
          const [curWeek, setCurWeek] = React.useState(() => { const d=new Date(); const dy=d.getDay(); const diff=dy===0?-6:1-dy; d.setDate(d.getDate()+diff); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); });
          const [reportTab, setReportTab] = React.useState("calendar");

          const selWorker = allWorkers.find(w=>w.id===selWorkerId) || allWorkers[0] || null;
          React.useEffect(() => { if (!selWorkerId && allWorkers.length>0) setSelWorkerId(allWorkers[0].id); }, [allWorkers]);

          function getWorkerLog(wId) {
            const merged = {};
            brigades.forEach(b => {
              const log = (b.timeLog||{})[wId]||{};
              Object.keys(log).forEach(d => { if(!merged[d]) merged[d]=log[d]; });
            });
            return merged;
          }

          function getWorkerTasks(wId, dates) {
            const result = {};
            dates.forEach(d => {
              const tasks = [];
              groups.forEach(g => {
                g.tasks.forEach(t => {
                  if (!(t.assignedWorkers||[]).includes(wId)) return;
                  const active = (t.start<=d&&t.end>=d) || (t.extensions||[]).some(e=>e.start<=d&&e.end>=d);
                  if (active) tasks.push({id:t.id,name:t.name,color:t.color||g.color});
                });
              });
              if (tasks.length>0) result[d]=tasks;
            });
            return result;
          }

          // Atsiperkamumas iš dienos įrašų (AtliktaiView duomenys)
          function getWorkerTasksSum(wId, forPeriodDays) {
            const atliktiDarbai = activeProject ? (activeProject.atliktiDarbai||[]) : [];
            const periodSet = forPeriodDays ? new Set(forPeriodDays) : null;
            let total = 0;
            atliktiDarbai.forEach(entry => {
              if (!(entry.workers||[]).includes(wId)) return;
              if (periodSet && !periodSet.has(entry.date)) return;
              const workerCount = (entry.workers||[]).length || 1;
              (entry.items||[]).forEach(item => {
                const qty = parseFloat(item.qty)||0;
                const price = parseFloat(item.price)||0;
                total += (qty * price) / workerCount;
              });
            });
            return total;
          }

          // Dienos įrašai pagal darbuotoją ir dieną (kalendoriui)
          function getWorkerDailyEntries(wId, dates) {
            const atliktiDarbai = activeProject ? (activeProject.atliktiDarbai||[]) : [];
            const result = {};
            dates.forEach(d => {
              const dayEntries = atliktiDarbai.filter(e =>
                e.date === d && (e.workers||[]).includes(wId)
              );
              if (dayEntries.length > 0) result[d] = dayEntries;
            });
            return result;
          }

          const periodDays = viewMode==="month" ? getMonthDays(curMonth) : getWeekDays(curWeek);
          const periodLabel = viewMode==="month"
            ? MNF[parseInt(curMonth.split("-")[1])-1]+" "+curMonth.split("-")[0]
            : getWeekLabel(curWeek);

          function prevPeriod() {
            if (viewMode==="month") { const p=curMonth.split("-").map(Number); const d=new Date(p[0],p[1]-2,1); setCurMonth(d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")); }
            else { setCurWeek(shiftWeek(curWeek,-1)); }
          }
          function nextPeriod() {
            if (viewMode==="month") { const p=curMonth.split("-").map(Number); const d=new Date(p[0],p[1],1); setCurMonth(d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")); }
            else { setCurWeek(shiftWeek(curWeek,1)); }
          }

          const last6Months = React.useMemo(() => {
            const ms=[]; const p=curMonth.split("-").map(Number);
            for(let i=5;i>=0;i--){const d=new Date(p[0],p[1]-1-i,1);ms.push(d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"));}
            return ms;
          }, [curMonth]);

          function exportWorkerExcel(w) {
            if(!window.XLSX||!w) return;
            const XL=window.XLSX; const wb=XL.utils.book_new();
            const log=getWorkerLog(w.id);
            const stats=calcWorkerMonth(w,{[w.id]:log},periodDays);
            const taskSum=getWorkerTasksSum(w.id);
            const taskMap=getWorkerTasks(w.id,periodDays);
            const rows=[["Data","Diena","Valandos","Darbai"]];
            periodDays.forEach(d=>{ const h=parseFloat((log[d]||{}).hours)||0; if(!h&&!(taskMap[d]||[]).length) return; rows.push([d,DOW[new Date(d).getDay()],h||"",(taskMap[d]||[]).map(t=>t.name).join("; ")]); });
            rows.push([],[""," ","Val.","Suma"]);
            rows.push(["IŠ VISO","",stats.totalHours,stats.totalPay.toFixed(2)+" €"]);
            rows.push(["Darbų suma","","",taskSum.toFixed(2)+" €"]);
            rows.push(["Abs. atsiperkamumas","","",(taskSum-stats.totalPay).toFixed(2)+" €"]);
            if(stats.totalPay>0) rows.push(["Sant. atsiperkamumas","","",(taskSum/stats.totalPay).toFixed(3)+"x"]);
            const ws=XL.utils.aoa_to_sheet(rows);
            ws["!cols"]=[{wch:14},{wch:6},{wch:10},{wch:60}];
            XL.utils.book_append_sheet(wb,ws,w.name.substring(0,31));
            XL.writeFile(wb,(w.name+"_"+periodLabel).replace(/[^\w]/g,"_")+".xlsx");
          }

          async function exportWorkerPDF(w) {
            if(!w) return;
            try {
              if (!window.pdfMake) { alert("pdfMake biblioteka neįkrauta"); return; }
              const BLUE = "#1e40af"; const LBLUE = "#dbeafe"; const GRAY = "#f8fafc";
              const log=getWorkerLog(w.id);
              const stats=calcWorkerMonth(w,{[w.id]:log},periodDays);
              const taskMap=getWorkerTasks(w.id,periodDays);
              const taskSum=getWorkerTasksSum(w.id);
              const absR=taskSum-stats.totalPay;
              const relR=stats.totalPay>0?(taskSum/stats.totalPay).toFixed(2):0;

              const kv=(k,v) => [{text:k+": ",fontSize:9,color:"#6b7280"},{text:String(v),fontSize:9,bold:true}];
              const hdrCell=(t) => ({text:t,bold:true,fontSize:8,color:"#ffffff",fillColor:"#475569",margin:[2,3,2,3]});

              const dayRows = periodDays.filter(d=>parseFloat((log[d]||{}).hours)>0).map((d,di)=>{
                const h=parseFloat((log[d]||{}).hours)||0;
                const ts=(taskMap[d]||[]).map(t=>t.name).join("; ");
                const bg=di%2===0?GRAY:"#ffffff";
                return [
                  {text:d,fontSize:8,fillColor:bg,margin:[2,2,2,2]},
                  {text:DOW[new Date(d).getDay()],fontSize:8,fillColor:bg,margin:[2,2,2,2]},
                  {text:String(h)+" val.",fontSize:8,alignment:"center",bold:true,color:"#166534",fillColor:bg,margin:[2,2,2,2]},
                  {text:ts,fontSize:7.5,fillColor:bg,margin:[2,2,2,2]},
                ];
              });

              pdfMake.createPdf({
                pageSize:"A4", pageMargins:[28,28,28,28],
                defaultStyle:{font:"Roboto"},
                content:[
                  {text:"Darbuotojo ataskaita", fontSize:16, bold:true, color:BLUE},
                  {text:w.name+" — "+periodLabel, fontSize:10, color:"#6b7280", margin:[0,2,0,10]},
                  {text:"Suvestinė", fontSize:12, bold:true, margin:[0,0,0,6]},
                  {table:{widths:["*","*"],body:[
                    [{stack:[
                      {text:[...kv("Pareigos",w.role||"—")],margin:[0,2,0,2]},
                      {text:[...kv("Įkainis",w.type==="hourly"?(w.hourlyRate+" €/val."):(w.dailyRate+" €/d."))],margin:[0,2,0,2]},
                      {text:[...kv("Valandos",stats.totalHours+" val.")],margin:[0,2,0,2]},
                      {text:[...kv("Atlyginimas",stats.totalPay.toFixed(2)+" €")],margin:[0,2,0,2]},
                    ],fillColor:LBLUE,margin:[8,8,8,8]},
                    {stack:[
                      {text:[...kv("Darbų suma",taskSum.toFixed(2)+" €")],margin:[0,2,0,2]},
                      {text:[...kv("Abs. atsiperkamumas",absR.toFixed(2)+" €")],margin:[0,2,0,2]},
                      {text:[...kv("Sant. atsiperkamumas",relR+"x")],margin:[0,2,0,2]},
                    ],fillColor:LBLUE,margin:[8,8,8,8]}
                    ]
                  ]},layout:"noBorders",margin:[0,0,0,16]},
                  {text:"Darbo dienos", fontSize:12, bold:true, margin:[0,0,0,6]},
                  dayRows.length>0 ? {
                    table:{widths:[64,54,44,"*"],headerRows:1,body:[
                      ["Data","Savaitės diena","Valandos","Darbai"].map(hdrCell),
                      ...dayRows
                    ]},layout:"noBorders"
                  } : {text:"Šiuo laikotarpiu darbo valandų nebuvo.",fontSize:9,color:"#9ca3af",italics:true},
                  {text:"Sugeneruota: "+new Date().toISOString().split("T")[0],fontSize:7,color:"#999",margin:[0,20,0,0]},
                ]
              }).download((w.name+"_"+periodLabel).replace(/[^\w\-]/g,"_")+".pdf");
            } catch(e){alert("PDF klaida: "+e.message);}
          }

          function BarChart({data}) {
            const max=Math.max(...data.map(d=>d.value),0.01);
            const W=data.length*44+10; const H=110;
            return (
              <svg viewBox={"0 0 "+W+" "+H} style={{width:"100%",height:H}} preserveAspectRatio="none">
                {data.map((d,i)=>{
                  const h=Math.round((d.value/max)*75);
                  const x=i*44+5; const barH=Math.max(h,2);
                  return (
                    <g key={i}>
                      <rect x={x} y={88-barH} width={38} height={barH} rx={3} fill={d.color||"#3b82f6"} opacity={0.85}/>
                      <text x={x+19} y={102} textAnchor="middle" fontSize={7} fill="#6b7280">{d.label.substring(0,7)}</text>
                      <text x={x+19} y={85-barH} textAnchor="middle" fontSize={7} fill="#374151" fontWeight="bold">{typeof d.value==="number"?d.value.toFixed(1):d.value}</text>
                    </g>
                  );
                })}
              </svg>
            );
          }

          if (allWorkers.length===0) return (
            <div className="bg-white rounded-xl shadow p-8 text-center text-gray-400">
              <div className="text-4xl mb-3">👷</div>
              <p>Nėra darbuotojų. Pridėkite juos Apskaitos skiltyje.</p>
            </div>
          );

          const logSel = selWorker ? getWorkerLog(selWorker.id) : {};
          const statsSel = selWorker ? calcWorkerMonth(selWorker, {[selWorker.id]:logSel}, periodDays) : null;
          const taskSumSel = selWorker ? getWorkerTasksSum(selWorker.id, periodDays) : 0;
          const taskMapSel = selWorker ? getWorkerTasks(selWorker.id, periodDays) : {};
          const dailyEntriesSel = selWorker ? getWorkerDailyEntries(selWorker.id, periodDays) : {};
          const absRet = statsSel ? taskSumSel - statsSel.totalPay : 0;
          const relRet = statsSel && statsSel.totalPay>0 ? taskSumSel/statsSel.totalPay : 0;

          return (
            <div className="space-y-4">
              <div className="bg-white rounded-xl shadow p-4 flex flex-wrap gap-3 items-center">
                <div className="flex gap-1 bg-stone-100 rounded-xl p-1">
                  <button onClick={()=>setViewMode("month")} className={"px-3 py-1 rounded-lg text-sm font-semibold "+(viewMode==="month"?"bg-white shadow text-ral3000":"text-gray-500")}>Mėnuo</button>
                  <button onClick={()=>setViewMode("week")} className={"px-3 py-1 rounded-lg text-sm font-semibold "+(viewMode==="week"?"bg-white shadow text-ral3000":"text-gray-500")}>Savaitė</button>
                </div>
                <div className="flex items-center gap-1">
                  <button onClick={prevPeriod} className="w-7 h-7 flex items-center justify-center rounded-lg bg-stone-100 hover:bg-gray-200 font-bold text-gray-600">‹</button>
                  <span className="font-semibold text-gray-800 min-w-40 text-center text-sm">{periodLabel}</span>
                  <button onClick={nextPeriod} className="w-7 h-7 flex items-center justify-center rounded-lg bg-stone-100 hover:bg-gray-200 font-bold text-gray-600">›</button>
                </div>
                <div className="flex gap-1 bg-stone-100 rounded-xl p-1 ml-auto">
                  <button onClick={()=>setReportTab("calendar")} className={"px-3 py-1 rounded-lg text-sm font-semibold "+(reportTab==="calendar"?"bg-white shadow text-ral3000":"text-gray-500")}>📆 Kalendorius</button>
                  <button onClick={()=>setReportTab("report")} className={"px-3 py-1 rounded-lg text-sm font-semibold "+(reportTab==="report"?"bg-white shadow text-ral3000":"text-gray-500")}>📄 Ataskaita</button>
                  <button onClick={()=>setReportTab("charts")} className={"px-3 py-1 rounded-lg text-sm font-semibold "+(reportTab==="charts"?"bg-white shadow text-ral3000":"text-gray-500")}>📊 Grafikai</button>
                </div>
              </div>

              <div className="flex gap-4">
                <div className="w-52 flex-shrink-0 bg-white rounded-xl shadow p-3 space-y-1">
                  <div className="text-xs font-bold text-gray-500 uppercase tracking-wide mb-2 px-1">Darbuotojai</div>
                  {allWorkers.map(w=>(
                    <button key={w.id} onClick={()=>setSelWorkerId(w.id)}
                      className={"w-full text-left px-2 py-1.5 rounded-lg text-sm transition-all "+(selWorkerId===w.id?"bg-ral3000 text-white font-semibold":"hover:bg-stone-100 text-gray-700")}>
                      <div className="font-medium truncate">{w.name}</div>
                      {w.role && <div className={"text-xs truncate "+(selWorkerId===w.id?"text-blue-200":"text-gray-400")}>{w.role}</div>}
                    </button>

        function PrasymaiFView({ allWorkers, projects, activeProjectId, setProjects }) {
          const today = new Date();
          const todayStr = today.getFullYear()+"-"+String(today.getMonth()+1).padStart(2,"0")+"-"+String(today.getDate()).padStart(2,"0");
          const COMPANY = "UAB „AMTEKA\"";
          const DIRECTOR = "Andrejui Učvatovui";
          const DIRECTOR_FULL = "Direktorius Andrejus Učvatovas";

          const getPrasymai = () => {
            const p = projects.find(x => x.id === activeProjectId);
            return p ? (p.prasymai || []) : [];
          };
          const savePrasymai = (list) => {
            setProjects(projects.map(p => p.id === activeProjectId ? { ...p, prasymai: list } : p));
          };
          const prasymai = getPrasymai();

          const [showForm, setShowForm] = React.useState(false);
          const [formType, setFormType] = React.useState(null); // "atostogos" | "poilsio"
          const [form, setForm] = React.useState(null);
          const [editId, setEditId] = React.useState(null);

          // Filtrai
          const [filterMonth, setFilterMonth] = React.useState("");
          const [filterName, setFilterName] = React.useState("");
          const [filterType, setFilterType] = React.useState("all");

          // Quick view
          const [quickViewPr, setQuickViewPr] = React.useState(null);

          const MONTHS_LT = ["Sausis","Vasaris","Kovas","Balandis","Gegužė","Birželis","Liepa","Rugpjūtis","Rugsėjis","Spalis","Lapkritis","Gruodis"];

          // Pareigos, kurios reikalauja pakeičiančio asmens
          const REQUIRES_REPLACEMENT = ["darbų vadovas", "projektų vadovas"];
          function needsReplacement(pareigos) {
            return REQUIRES_REPLACEMENT.some(r => (pareigos||"").toLowerCase().trim() === r);
          }

          // Žinomi asmenys (įsiminti iš ankstesnių prašymų) – saugomi localStorage
          const [knownPersons, setKnownPersons] = React.useState(() => {
            try { return JSON.parse(localStorage.getItem("prasymai_knownPersons") || "[]"); } catch(e) { return []; }
          });
          function saveKnownPersons(list) {
            setKnownPersons(list);
            try { localStorage.setItem("prasymai_knownPersons", JSON.stringify(list)); } catch(e) {}
          }
          function rememberPerson(vardas, pareigos) {
            if (!vardas) return;
            const existing = knownPersons.find(p => p.vardas.toLowerCase() === vardas.toLowerCase());
            if (!existing) {
              saveKnownPersons([...knownPersons, { vardas, pareigos: pareigos||"" }]);
            } else if (pareigos && existing.pareigos !== pareigos) {
              saveKnownPersons(knownPersons.map(p => p.vardas.toLowerCase() === vardas.toLowerCase() ? { ...p, pareigos } : p));
            }
          }

          function emptyAtostogos() {
            return { type: "atostogos", vardas: "", pareigos: "", data: todayStr, nuo: "", iki: "", pakeicias: "", pakeicias_pareigos: "" };
          }
          function emptyPoilsio() {
            return { type: "poilsio", vardas: "", pareigos: "", data: todayStr, poilsioDiena: "", pakeicias: "", pakeicias_pareigos: "" };
          }

          function openNew(type) {
            setFormType(type);
            setForm(type === "atostogos" ? emptyAtostogos() : emptyPoilsio());
            setEditId(null);
            setShowForm(true);
          }
          function openEdit(pr) {
            setFormType(pr.type);
            setForm({ pakeicias: "", pakeicias_pareigos: "", ...pr });
            setEditId(pr.id);
            setShowForm(true);
          }
          function saveForm() {
            if (!form.vardas || !form.data) return;
            if (form.type === "atostogos" && (!form.nuo || !form.iki)) return;
            if (form.type === "poilsio" && !form.poilsioDiena) return;
            // Įsiminti pareiškėją
            rememberPerson(form.vardas, form.pareigos);
            // Įsiminti pakeičiantį asmenį (jei įvestas rankiniu būdu)
            if (form.pakeicias) rememberPerson(form.pakeicias, form.pakeicias_pareigos);
            if (editId) {
              savePrasymai(prasymai.map(p => p.id === editId ? { ...form, id: editId } : p));
            } else {
              savePrasymai([...prasymai, { ...form, id: Date.now() }]);
            }
            setShowForm(false); setForm(null); setEditId(null);
          }
          function deletePr(id) {
            if (window.confirm("Ištrinti šį prašymą?")) savePrasymai(prasymai.filter(p => p.id !== id));
          }

          // Filtravimas
          const filtered = prasymai.filter(p => {
            const dateMatch = !filterMonth || p.data.startsWith(filterMonth);
            const nameMatch = !filterName || p.vardas.toLowerCase().includes(filterName.toLowerCase());
            const typeMatch = filterType === "all" || p.type === filterType;
            return dateMatch && nameMatch && typeMatch;
          }).sort((a,b) => b.data.localeCompare(a.data));

          // PDF generavimas
          function formatDateLT(str) {
            if (!str) return "";
            const [y,m,d] = str.split("-");
            return `${parseInt(d)} d.`;
          }
          function formatDateFullLT(str) {
            if (!str) return "";
            const [y,m,d] = str.split("-");
            return `${parseInt(d)} d.`;
          }
          function formatDateDocLT(str) {
            if (!str) return "";
            const [y,m,d] = str.split("-");
            const mn = ["sausio","vasario","kovo","balandžio","gegužės","birželio","liepos","rugpjūčio","rugsėjo","spalio","lapkričio","gruodžio"];
            return `${parseInt(d)} d.`;
          }

          async function generatePDF(pr) {
            const RAL_HEX = "#CC3300";
            const RAL_DARK_HEX = "#8C1E00";

            if (!window.pdfMake) {
              alert("pdfMake biblioteka ne\u012fkrauta.");
              return;
            }

            const dateParts = pr.data.split("-");
            const dateYear = dateParts[0];
            const dateMonthLT = MONTHS_LT[parseInt(dateParts[1])-1];
            const dateDay = parseInt(dateParts[2]);

            // 1cm = 28pt. pdfMake A4 = 595x842pt
            const M = 28; // 1cm margins
            const INNER_W = 595 - M * 2; // ~539pt

            let bodyContent = [];
            if (pr.type === "atostogos") {
              const segments = splitVacationAroundHolidays(pr.nuo, pr.iki);
              let periodText = "";
              if (segments.length <= 1) {
                // Nėra švenčių – vienas laikotarpis
                const [ny, nm, nd] = pr.nuo.split("-");
                const [iy, im, id2] = pr.iki.split("-");
                const nuoMen = MONTHS_LT[parseInt(nm)-1];
                const ikiMen = MONTHS_LT[parseInt(im)-1];
                periodText = "nuo "+ny+" m. "+nuoMen+" m\u0117n. "+parseInt(nd)+" d. iki "+iy+" m. "+ikiMen+" m\u0117n. "+parseInt(id2)+" d. imtinai";
              } else {
                // Skaidoma į kelis periodus
                const parts = segments.map(seg => {
                  const [sny, snm, snd] = seg.nuo.split("-");
                  const [siy, sim, sid] = seg.iki.split("-");
                  const snuoMen = MONTHS_LT[parseInt(snm)-1];
                  const sikiMen = MONTHS_LT[parseInt(sim)-1];
                  return "nuo "+sny+" m. "+snuoMen+" m\u0117n. "+parseInt(snd)+" d. iki "+siy+" m. "+sikiMen+" m\u0117n. "+parseInt(sid)+" d. imtinai";
                });
                periodText = parts.join(" ir ");
              }
              bodyContent = [
                { text: "Pra\u0161au i\u0161leisti mane kasmetini\u0173 atostog\u0173 laikotarpiu "+periodText+".", style: "body", margin: [0,0,0,10] },
                { text: "Pra\u0161au man priklausan\u010dius atostoginius i\u0161mok\u0117ti kartu su darbo u\u017emokes\u010dio mok\u0117jimu.", style: "body" },
              ];
            } else {
              const [py, pm, pd] = pr.poilsioDiena.split("-");
              const poilsioMen = MONTHS_LT[parseInt(pm)-1];
              bodyContent = [
                { text: "Pra\u0161au suteikti man papildom\u0105 poilsio dien\u0105 "+py+" m. "+poilsioMen+" m\u0117n. "+parseInt(pd)+" d., nes auginu 2 vaikus iki 12 met\u0173.", style: "body" },
              ];
            }

            const titleText = pr.type === "atostogos"
              ? "PRA\u0160YMAS D\u0116L KASMETINI\u0172 ATOSTOG\u0172"
              : "PRA\u0160YMAS D\u0116L PAPILDOMOS POILSIO DIENOS SUTEIKIMO";

            const docDef = {

                        if(!form.vardas||!form.data||(formType==="atostogos"&&(!form.nuo||!form.iki))||(formType==="poilsio"&&!form.poilsioDiena)||(needsReplacement(form.pareigos)&&!form.pakeicias)) { alert("Užpildykite visus privalomus laukus!\n\nDarbų / Projektų vadovui būtinas pakeičiantis asmuo."); return; }
                        const temp = editId ? {...form, id: editId} : {...form, id: Date.now()};
                        generatePDF(temp);
                      }} className="px-4 bg-ral3000-subtle hover:bg-ral3000-subtle text-ral3000 rounded-lg py-2.5 text-sm font-semibold">
                        📥 PDF
                      </button>
                      <button onClick={()=>{setShowForm(false);setForm(null);setEditId(null);}}
                        className="px-4 bg-stone-100 hover:bg-gray-200 text-gray-600 rounded-lg py-2.5 text-sm">Atšaukti</button>
                    </div>
                  </div>
                </Modal>
              )}
              {/* Quick View modalas */}
              {quickViewPr && (() => {
                const pr = quickViewPr;
                const COMPANY_QV = "UAB „AMTEKA\"";
                const DIRECTOR_QV = "Direktoriui Andrejui Učvatovui";
                const [py, pm, pd] = pr.data.split("-");
                const dateLabel = `${parseInt(pd)} ${MONTHS_LT[parseInt(pm)-1]} ${py} m.`;

                let bodyText = "";
                let titleText = "";
                if (pr.type === "atostogos") {
                  titleText = "PRAŠYMAS DĖL KASMETINIŲ ATOSTOGŲ";
                  const segs = splitVacationAroundHolidays(pr.nuo, pr.iki);
                  let periodText = "";
                  if (segs.length <= 1) {
                    const [ny,nm,nd] = pr.nuo.split("-"); const [iy,im,id2] = pr.iki.split("-");
                    periodText = `nuo ${ny} m. ${MONTHS_LT[parseInt(nm)-1]} mėn. ${parseInt(nd)} d. iki ${iy} m. ${MONTHS_LT[parseInt(im)-1]} mėn. ${parseInt(id2)} d. imtinai`;
                  } else {
                    periodText = segs.map(seg => {
                      const [sny,snm,snd] = seg.nuo.split("-"); const [siy,sim,sid] = seg.iki.split("-");
                      return `nuo ${sny} m. ${MONTHS_LT[parseInt(snm)-1]} mėn. ${parseInt(snd)} d. iki ${siy} m. ${MONTHS_LT[parseInt(sim)-1]} mėn. ${parseInt(sid)} d. imtinai`;
                    }).join(" ir ");
                  }
                  const wdays = countWorkdays(pr.nuo, pr.iki);
                  bodyText = { main: `Prašau išleisti mane kasmetinių atostogų laikotarpiu ${periodText}.`, extra: "Prašau man priklausančius atostoginius išmokėti kartu su darbo užmokesčio mokėjimu.", wdays };
                } else {
                  titleText = "PRAŠYMAS DĖL PAPILDOMOS POILSIO DIENOS SUTEIKIMO";
                  const [qy,qm,qd] = pr.poilsioDiena.split("-");
                  bodyText = { main: `Prašau suteikti man papildomą poilsio dieną ${qy} m. ${MONTHS_LT[parseInt(qm)-1]} mėn. ${parseInt(qd)} d., nes auginu 2 vaikus iki 12 metų.`, extra: null };
                }

                return (
                  <Modal title="👁 Dokumento peržiūra" onClose={()=>setQuickViewPr(null)}>
                    {/* Dokumento kortelė */}
                    <div className="rounded-xl overflow-hidden border border-gray-200 shadow-sm">
                      {/* Viršutinė juosta */}
                      <div className="bg-ral3000 px-5 py-3 text-center">
                        <div className="text-white font-bold text-base">{COMPANY_QV}</div>
                        <div className="text-ral3000-light text-xs mt-0.5">{titleText}</div>
                      </div>

                      {/* Turinys */}
                      <div className="bg-white px-6 py-5 space-y-4">
                        {/* Data ir vieta */}
                        <div className="text-center text-sm text-gray-500">{dateLabel} &nbsp;·&nbsp; Vilnius</div>

                        {/* Teikėjas / Adresatas */}
                        <div className="flex justify-between items-start gap-4 text-sm border-b border-gray-100 pb-4">
                          <div>
                            <div className="font-bold text-gray-800">{pr.vardas || "—"}</div>
                            <div className="text-gray-500 text-xs">{pr.pareigos || ""}</div>
                          </div>
                          <div className="text-right text-gray-500 text-xs">
                            <div>{COMPANY_QV}</div>
                            <div>{DIRECTOR_QV}</div>
                          </div>
                        </div>

                        {/* Pavadinimas */}
                        <div className="text-center font-bold text-ral3000 text-sm uppercase tracking-wide">{titleText}</div>

                        {/* Tekstas */}
                        <div className="text-sm text-gray-800 leading-relaxed space-y-2">
                          <p>{bodyText.main}</p>
                          {bodyText.extra && <p>{bodyText.extra}</p>}
                        </div>

                        {/* Darbo dienų info */}
                        {pr.type === "atostogos" && pr.nuo && pr.iki && (
                          <div className="text-xs text-ral3000 bg-ral3000-subtle rounded-lg px-3 py-2">
                            📅 Darbo dienų skaičius: <strong>{bodyText.wdays} d.</strong>
                            {splitVacationAroundHolidays(pr.nuo, pr.iki).length > 1 && (
                              <span className="ml-2 text-ral3000-mid">⚠️ Suskaidyta dėl švenčių</span>
                            )}
                          </div>
                        )}

                        {/* Pakeičiantis asmuo */}
                        {pr.pakeicias && (
                          <div className="text-xs text-gray-500 border-t border-gray-100 pt-3">
                            <span className="font-semibold">Pakeičiantysis:</span> {pr.pakeicias}{pr.pakeicias_pareigos ? `, ${pr.pakeicias_pareigos}` : ""}
                          </div>
                        )}
                      </div>

                      {/* Apatinė juosta */}
                      <div className="bg-ral3000 px-5 py-1.5 flex justify-between">
                        <span className="text-ral3000-light text-xs">{COMPANY_QV}</span>
                        <span className="text-ral3000-light text-xs">Sugeneruota: {(() => { const t = new Date(); return t.getFullYear()+"-"+String(t.getMonth()+1).padStart(2,"0")+"-"+String(t.getDate()).padStart(2,"0"); })()}</span>
                      </div>
                    </div>

                    {/* Veiksmai */}
                    <div className="flex gap-2 mt-4">
                      <button onClick={()=>{generatePDF(pr); setQuickViewPr(null);}}
                        className="flex-1 bg-ral3000 hover:bg-ral3000-dark text-white rounded-lg py-2.5 text-sm font-semibold">📥 Atsisiųsti PDF</button>
                      <button onClick={()=>{setQuickViewPr(null); openEdit(pr);}}
                        className="px-4 bg-ral3000-subtle hover:bg-yellow-200 text-ral3000-mid rounded-lg py-2.5 text-sm font-semibold">✏️ Redaguoti</button>
                      <button onClick={()=>setQuickViewPr(null)}
                        className="px-4 bg-stone-100 hover:bg-gray-200 text-gray-600 rounded-lg py-2.5 text-sm">Uždaryti</button>
                    </div>
                  </Modal>
                );
              })()}
            </div>
          );
        }
        // ══ pabaiga: PrasymaiFView ══════════════════════════════════

        // ══════════════════════════════════════════════════════════
        // TO DO LIST — v2 su visais funkcionalumais
        // ══════════════════════════════════════════════════════════
        function TodoListView({ projects, activeProjectId, setProjects }) {
          const TODAY = (() => { const d = new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); })();

          // ── Duomenys ──
          const getTodoData = () => {
            const p = projects.find(x => x.id === activeProjectId);
            const def = {
              lists: [
                { id: 1, name: "Mano diena",  icon: "☀️", color: "#CC2500", tasks: [] },
                { id: 2, name: "Užduotys",    icon: "📋", color: "#596163", tasks: [] },
              ],
              nextListId: 3, nextTaskId: 1,
              persons: [],   // išsaugoti asmenys
            };
            return p ? (p.todoData || def) : def;
          };
          const saveTodoData = (data) => {
            setProjects(projects.map(p => p.id === activeProjectId ? { ...p, todoData: data } : p));
          };

          const todoData   = getTodoData();
          const { lists, nextListId, nextTaskId, persons = [] } = todoData;

          // ── State ──
          const [activeListId,  setActiveListId]  = React.useState(() => lists[0]?.id || null);
          const [filterView,    setFilterView]     = React.useState("list");   // list|today|important|planned|all
          const [periodMode,    setPeriodMode]     = React.useState("week");   // day|week|month
          const [calDate,       setCalDate]        = React.useState(TODAY);    // anchor date for calendar
          const [editingTask,   setEditingTask]    = React.useState(null);
          const [newTaskText,   setNewTaskText]    = React.useState("");
          const [showNewList,   setShowNewList]    = React.useState(false);
          const [newListName,   setNewListName]    = React.useState("");
          const [searchQ,       setSearchQ]        = React.useState("");
          const [editListId,    setEditListId]     = React.useState(null);  // inline rename
          const [editListName,  setEditListName]   = React.useState("");

          const LIST_COLORS = ["#CC2500","#596163","#3E4547","#A01D00","#8A9496","#7B3F00","#1A5C3A","#1B3A6B"];

          // ── Kalendoriaus navigacija ──
          function calPrev() {
            const d = new Date(calDate);
            if (periodMode === "day")   d.setDate(d.getDate() - 1);
            if (periodMode === "week")  d.setDate(d.getDate() - 7);
            if (periodMode === "month") d.setMonth(d.getMonth() - 1);
            setCalDate(d.toISOString().slice(0,10));
          }
          function calNext() {
            const d = new Date(calDate);
            if (periodMode === "day")   d.setDate(d.getDate() + 1);
            if (periodMode === "week")  d.setDate(d.getDate() + 7);
            if (periodMode === "month") d.setMonth(d.getMonth() + 1);
            setCalDate(d.toISOString().slice(0,10));
          }

          // Aktyvaus periodo pradžia / pabaiga
          function getPeriodRange() {
            const d = new Date(calDate);
            if (periodMode === "day") {
              const s = calDate;
              return { start: s, end: s, label: calDate };
            }
            if (periodMode === "week") {
              const dow = d.getDay() === 0 ? 6 : d.getDay() - 1;
              const mon = new Date(d); mon.setDate(d.getDate() - dow);
              const sun = new Date(mon); sun.setDate(mon.getDate() + 6);
              const fmt = x => x.toISOString().slice(0,10);
              return { start: fmt(mon), end: fmt(sun), label: fmt(mon)+" – "+fmt(sun) };
            }
            if (periodMode === "month") {
              const y = d.getFullYear(), m = d.getMonth();
              const s = `${y}-${String(m+1).padStart(2,"0")}-01`;
              const e = new Date(y, m+1, 0);
              const end = e.toISOString().slice(0,10);
              return { start: s, end: end, label: `${y}-${String(m+1).padStart(2,"0")}` };
            }
          }

          // ── Filtravimas ──
          function getVisibleTasks() {
            let tasks = [];
            const range = getPeriodRange();
            const inRange = t => {
              if (!t.createdAt) return true;
              return t.createdAt >= range.start && t.createdAt <= range.end;
            };

            if (filterView === "today") {
              lists.forEach(l => l.tasks.forEach(t => { if (t.myDay && inRange(t)) tasks.push({...t, _listId: l.id, _listName: l.name, _listColor: l.color}); }));
            } else if (filterView === "important") {
              lists.forEach(l => l.tasks.forEach(t => { if (t.important && inRange(t)) tasks.push({...t, _listId: l.id, _listName: l.name, _listColor: l.color}); }));
            } else if (filterView === "planned") {
              lists.forEach(l => l.tasks.forEach(t => { if (t.dueDate && inRange(t)) tasks.push({...t, _listId: l.id, _listName: l.name, _listColor: l.color}); }));
            } else if (filterView === "all") {
              lists.forEach(l => l.tasks.forEach(t => { if (inRange(t)) tasks.push({...t, _listId: l.id, _listName: l.name, _listColor: l.color}); }));
            } else {
              const al = lists.find(l => l.id === activeListId);
              if (al) tasks = al.tasks.filter(inRange).map(t => ({...t, _listId: al.id, _listName: al.name, _listColor: al.color}));
            }
            if (searchQ) tasks = tasks.filter(t => t.text.toLowerCase().includes(searchQ.toLowerCase()) || (t.note||"").toLowerCase().includes(searchQ.toLowerCase()) || (t.assignee||"").toLowerCase().includes(searchQ.toLowerCase()));
            return tasks;
          }

          // ── CRUD užduotys ──
          function updateTask(taskId, listId, patch) {
            const newLists = lists.map(l => l.id === listId
              ? {...l, tasks: l.tasks.map(t => t.id === taskId ? {...t, ...patch} : t)}
              : l);
            saveTodoData({...todoData, lists: newLists});
            if (editingTask?.id === taskId) setEditingTask(prev => ({...prev, ...patch, _listId: listId}));
          }

          function deleteTask(taskId, listId) {
            const newLists = lists.map(l => l.id === listId
              ? {...l, tasks: l.tasks.filter(t => t.id !== taskId)}
              : l);
            saveTodoData({...todoData, lists: newLists});
            if (editingTask?.id === taskId) setEditingTask(null);
          }

          function addTask() {
            if (!newTaskText.trim()) return;
            const targetListId = filterView === "list" && activeListId ? activeListId : (lists[0]?.id || null);
            if (!targetListId) return;
            const task = {
              id: nextTaskId, text: newTaskText.trim(), done: false, important: false,
              myDay: filterView === "today", dueDate: "", note: "", steps: [],
              createdAt: TODAY, assignee: "", _listId: targetListId,
            };
            const newLists = lists.map(l => l.id === targetListId ? {...l, tasks: [...l.tasks, task]} : l);
            saveTodoData({...todoData, lists: newLists, nextTaskId: nextTaskId + 1});
            setNewTaskText("");
          }

          // ── Asmenys ──
          function addPerson(name) {
            const trimmed = name.trim();
            if (!trimmed || persons.includes(trimmed)) return;
            saveTodoData({...todoData, persons: [...persons, trimmed]});
          }

          // ── Sąrašai ──
          function addList() {
            if (!newListName.trim()) return;
            const color = LIST_COLORS[lists.length % LIST_COLORS.length];
            const nl = { id: nextListId, name: newListName.trim(), icon: "📋", color, tasks: [] };
            saveTodoData({...todoData, lists: [...lists, nl], nextListId: nextListId + 1});
            setActiveListId(nl.id); setFilterView("list");
            setNewListName(""); setShowNewList(false);
          }

          function saveListName(listId) {
            if (!editListName.trim()) { setEditListId(null); return; }
            saveTodoData({...todoData, lists: lists.map(l => l.id === listId ? {...l, name: editListName.trim()} : l)});
            setEditListId(null);
          }

          function deleteList(listId) {
            if (!window.confirm("Ištrinti šį sąrašą ir visas jo užduotis?")) return;
            const newLists = lists.filter(l => l.id !== listId);
            saveTodoData({...todoData, lists: newLists});
            setActiveListId(newLists[0]?.id || null);
            if (editingTask?._listId === listId) setEditingTask(null);
          }

          // ── Žingsniai ──
          function addStep(task) {
            const stepText = window.prompt("Žingsnio tekstas:");
            if (!stepText?.trim()) return;
            const steps = [...(task.steps||[]), {id: Date.now(), text: stepText.trim(), done: false}];
            updateTask(task.id, task._listId, {steps});
          }
          function toggleStep(task, stepId) {
            const steps = (task.steps||[]).map(s => s.id===stepId ? {...s, done:!s.done} : s);
            updateTask(task.id, task._listId, {steps});
          }
          function deleteStep(task, stepId) {
            const steps = (task.steps||[]).filter(s => s.id!==stepId);
            updateTask(task.id, task._listId, {steps});
          }

          // ── Kalendorius ──
          const range = getPeriodRange();
          const MONTHS_LT2 = ["Sausis","Vasaris","Kovas","Balandis","Gegužė","Birželis","Liepa","Rugpjūtis","Rugsėjis","Spalis","Lapkritis","Gruodis"];
          const DAYS_SHORT = ["Pr","An","Tr","Kt","Pn","Št","Sk"];

          function renderCalendar() {
            if (periodMode === "day") {
              const d = new Date(calDate);
              return (
                <div className="text-center py-2">
                  <div className="text-sm font-bold text-gray-800">{calDate}</div>
                  <div className="text-xs text-gray-500">{DAYS_SHORT[d.getDay()===0?6:d.getDay()-1]}, {MONTHS_LT2[d.getMonth()]}</div>
                </div>
              );
            }
            if (periodMode === "week") {
              const dow = new Date(calDate).getDay() === 0 ? 6 : new Date(calDate).getDay() - 1;
              const mon = new Date(calDate); mon.setDate(mon.getDate() - dow);
              const days = Array.from({length:7}, (_,i) => { const x=new Date(mon); x.setDate(mon.getDate()+i); return x; });
              return (
                <div className="px-2 pb-2">
                  <div className="grid grid-cols-7 gap-0.5">
                    {DAYS_SHORT.map(d => <div key={d} className="text-center text-xs text-gray-400 py-1 font-semibold">{d}</div>)}
                    {days.map(d => {
                      const ds = d.toISOString().slice(0,10);
                      const isToday = ds === TODAY;
                      const hasTasks = lists.some(l => l.tasks.some(t => t.createdAt === ds));
                      return (
                        <div key={ds} onClick={() => { setCalDate(ds); }}
                          className={`text-center py-1.5 rounded-lg cursor-pointer text-xs font-medium transition-all relative
                            ${isToday ? "bg-ral3000 text-white" : "hover:bg-stone-100 text-gray-700"}`}>
                          {d.getDate()}
                          {hasTasks && <div className="absolute bottom-0.5 left-1/2 -translate-x-1/2 w-1 h-1 rounded-full" style={{background: isToday ? "white" : "#CC2500"}}></div>}
                        </div>
                      );
                    })}
                  </div>
                </div>
              );
            }
            if (periodMode === "month") {
              const d = new Date(calDate);
              const y = d.getFullYear(), m = d.getMonth();
              const firstDow = new Date(y, m, 1).getDay();
              const offset = firstDow === 0 ? 6 : firstDow - 1;
              const daysInMonth = new Date(y, m+1, 0).getDate();
              const cells = Array.from({length: offset + daysInMonth}, (_,i) => i < offset ? null : i - offset + 1);
              while (cells.length % 7 !== 0) cells.push(null);
              return (
                <div className="px-2 pb-2">
                  <div className="grid grid-cols-7 gap-0.5">
                    {DAYS_SHORT.map(d => <div key={d} className="text-center text-xs text-gray-400 py-1 font-semibold">{d}</div>)}
                    {cells.map((day, i) => {
                      if (!day) return <div key={i}/>;
                      const ds = `${y}-${String(m+1).padStart(2,"0")}-${String(day).padStart(2,"0")}`;
                      const isToday = ds === TODAY;
                      const hasTasks = lists.some(l => l.tasks.some(t => t.createdAt === ds));
                      const inSel = ds >= range.start && ds <= range.end;
                      return (
                        <div key={i} onClick={() => { setCalDate(ds); }}
                          className={`text-center py-1 rounded-lg cursor-pointer text-xs font-medium transition-all relative
                            ${isToday ? "bg-ral3000 text-white" : inSel ? "bg-ral3000-subtle text-ral3000" : "hover:bg-stone-100 text-gray-700"}`}>
                          {day}
                          {hasTasks && <div className="absolute bottom-0.5 left-1/2 -translate-x-1/2 w-1 h-1 rounded-full" style={{background: isToday ? "white" : "#CC2500"}}></div>}
                        </div>
                      );
                    })}
                  </div>
                </div>
              );
            }
          }

          function calTitle() {
            const d = new Date(calDate);
            if (periodMode === "day")   return `${d.getDate()} ${MONTHS_LT2[d.getMonth()]} ${d.getFullYear()}`;
            if (periodMode === "week")  return `${range.start.slice(5)} – ${range.end.slice(5)} / ${range.start.slice(0,4)}`;
            if (periodMode === "month") return `${MONTHS_LT2[d.getMonth()]} ${d.getFullYear()}`;
          }

          // ── Render ──
          const visibleTasks = getVisibleTasks();
          const doneTasks    = visibleTasks.filter(t => t.done);
          const pendingTasks = visibleTasks.filter(t => !t.done);

          const activeList = lists.find(l => l.id === activeListId) || null;
          const SPECIAL_VIEWS = [
            { id: "today",     icon: "☀️", label: "Mano diena",  color: "#CC2500" },
            { id: "important", icon: "⭐", label: "Svarbūs",     color: "#A01D00" },
            { id: "planned",   icon: "📅", label: "Suplanuoti",  color: "#596163" },
            { id: "all",       icon: "🏠", label: "Visi",        color: "#3E4547" },
          ];
          const currentView = filterView === "list"
            ? (activeList ? {...activeList, label: activeList.name} : {label:"Užduotys", color:"#596163", icon:"📋"})
            : (SPECIAL_VIEWS.find(v => v.id === filterView) || SPECIAL_VIEWS[0]);
          const viewColor = currentView.color || "#CC2500";

          const sideItemCls = (active, color) =>
            `flex items-center gap-2 px-3 py-2 rounded-xl cursor-pointer text-sm font-medium transition-all select-none ${active ? "text-white shadow-sm" : "text-gray-600 hover:bg-stone-100"}`;

          return (
            <div className="flex bg-stone-50 overflow-hidden" style={{height:"calc(100vh - 80px)"}}>

              {/* ── KAIRĖ KOLONA ── */}
              <div className="w-60 flex-shrink-0 bg-white border-r border-gray-200 flex flex-col overflow-hidden">

                {/* Paieška */}
                <div className="p-3 border-b border-gray-100">
                  <div className="relative">
                    <span className="absolute left-2.5 top-1/2 -translate-y-1/2 text-gray-300 text-sm">🔍</span>
                    <input value={searchQ} onChange={e=>setSearchQ(e.target.value)} placeholder="Ieškoti..."
                      className="w-full border border-gray-200 rounded-lg pl-7 pr-6 py-1.5 text-xs focus:outline-none bg-stone-50"/>
                    {searchQ && <button onClick={()=>setSearchQ("")} className="absolute right-2 top-1/2 -translate-y-1/2 text-gray-300 hover:text-gray-500 text-base leading-none">×</button>}
                  </div>
                </div>

                {/* Specialūs rodiniai */}
                <div className="p-2 space-y-0.5">
                  {SPECIAL_VIEWS.map(v => {
                    const active = filterView === v.id;
                    const cnt = v.id==="today"     ? lists.reduce((a,l)=>a+l.tasks.filter(t=>t.myDay&&!t.done).length,0)
                              : v.id==="important" ? lists.reduce((a,l)=>a+l.tasks.filter(t=>t.important&&!t.done).length,0)
                              : v.id==="planned"   ? lists.reduce((a,l)=>a+l.tasks.filter(t=>t.dueDate&&!t.done).length,0)
                              : lists.reduce((a,l)=>a+l.tasks.filter(t=>!t.done).length,0);
                    return (
                      <div key={v.id} onClick={()=>{setFilterView(v.id);setEditingTask(null);}}
                        className={sideItemCls(active, v.color)} style={active?{background:v.color}:{}}>
                        <span>{v.icon}</span>
                        <span className="flex-1">{v.label}</span>
                        {cnt>0 && <span className={`text-xs font-bold px-1.5 py-0.5 rounded-full ${active?"bg-white/25 text-white":"bg-gray-100 text-gray-500"}`}>{cnt}</span>}
