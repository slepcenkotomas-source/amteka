        // Atsakingo asmens pasirinkimo komponentas — išsaugo tik patvirtinus
        function AssigneeInput({ value, persons, onSave }) {
          const [input,   setInput]   = React.useState(value || "");
          const [open,    setOpen]    = React.useState(false);
          const [changed, setChanged] = React.useState(false);
          const ref     = React.useRef(null);
          const listRef = React.useRef(null);

          // Sinchronizuoti kai value pasikeičia iš išorės
          React.useEffect(() => { setInput(value || ""); setChanged(false); }, [value]);

          // Uždaryti dropdown paspaudus kitur
          React.useEffect(() => {
            function handler(e) {
              if (ref.current && !ref.current.contains(e.target)) {
                setOpen(false);
              }
            }
            document.addEventListener("mousedown", handler);
            return () => document.removeEventListener("mousedown", handler);
          }, []);

          const filtered = input.trim()
            ? persons.filter(p => p.toLowerCase().includes(input.toLowerCase()))
            : persons;

          function confirm(val) {
            const trimmed = (val ?? input).trim();
            setInput(trimmed);
            setOpen(false);
            setChanged(false);
            if (trimmed !== value) onSave(trimmed);
          }

          function handleSelect(p) {
            setInput(p);
            setOpen(false);
            setChanged(false);
            if (p !== value) onSave(p);
          }

          function clear() {
            setInput("");
            setChanged(false);
            if (value) onSave("");
          }

          return (
            <div ref={ref} className="relative">
              <div className="flex gap-1.5">
                <div className="relative flex-1">
                  <input
                    value={input}
                    onChange={e => { setInput(e.target.value); setChanged(true); setOpen(true); }}
                    onFocus={() => setOpen(true)}
                    onKeyDown={e => {
                      if (e.key === "Enter") { e.preventDefault(); confirm(); }
                      if (e.key === "Escape") { setOpen(false); setInput(value || ""); setChanged(false); }
                    }}
                    placeholder="Įveskite arba pasirinkite..."
                    className={`w-full border rounded-lg px-3 py-1.5 text-xs focus:outline-none pr-6 transition-all ${changed ? "border-ral3000-light bg-white" : "border-gray-200 bg-stone-50"}`}
                  />
                  {input && (
                    <button onMouseDown={e=>{ e.preventDefault(); clear(); }}
                      className="absolute right-2 top-1/2 -translate-y-1/2 text-gray-300 hover:text-gray-500 text-base leading-none">×</button>
                  )}
                </div>
                {changed && (
                  <button onMouseDown={e=>{ e.preventDefault(); confirm(); }}
                    className="px-3 py-1.5 rounded-lg bg-ral7012 hover:bg-ral7012-dark text-white text-xs font-bold transition-all flex-shrink-0">
                    ✔
                  </button>
                )}
              </div>

              {/* Dropdown */}
              {open && filtered.length > 0 && (
                <div ref={listRef} className="absolute z-50 w-full mt-1 bg-white border border-gray-200 rounded-lg shadow-md overflow-hidden">
                  {filtered.map(p => (
                    <div key={p}
                      onMouseDown={e => { e.preventDefault(); handleSelect(p); }}
                      className={`px-3 py-2 text-xs cursor-pointer transition-all flex items-center gap-2
                        ${p === value ? "bg-ral3000-subtle text-ral3000 font-semibold" : "text-gray-700 hover:bg-stone-100"}`}>
                      <span>👤</span> {p}
                      {p === value && <span className="ml-auto">✔</span>}
                    </div>
                  ))}
                </div>
              )}

              {/* Esamas priskirtas asmuo žymė */}
              {value && !changed && (
                <div className="mt-1.5 text-xs text-ral7012 font-medium">👤 {value}</div>
              )}
            </div>
          );
        }

        function TodoTaskRow({ task, viewColor, done, onToggle, onToggleImportant, onOpen, isEditing, showListName }) {
          const TODAY = (() => { const d = new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); })();
          const overdue  = task.dueDate && task.dueDate < TODAY && !done;
          const dueToday = task.dueDate === TODAY && !done;
          const stepsTotal = (task.steps||[]).length;
          const stepsDone  = (task.steps||[]).filter(s=>s.done).length;
          return (
            <div onClick={onOpen}
              className={`flex items-center gap-3 bg-white rounded-xl px-3 py-2.5 cursor-pointer transition-all border ${isEditing?"border-gray-300 shadow-md":"border-transparent shadow-sm hover:shadow-md hover:border-gray-200"} ${done?"opacity-55":""}`}>
              {/* Spalvota juostelė kairėje */}
              {task._listColor && !done && <div className="w-0.5 h-8 rounded-full flex-shrink-0" style={{background: task._listColor}}></div>}
              <button onClick={e=>{e.stopPropagation();onToggle();}}
                className="w-5 h-5 rounded-full border-2 flex-shrink-0 flex items-center justify-center transition-all"
                style={{borderColor:viewColor, background:done?viewColor:"transparent"}}>
                {done && <svg width="10" height="8" viewBox="0 0 10 8" fill="none"><path d="M1 4l3 3 5-6" stroke="white" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/></svg>}
              </button>
              <div className="flex-1 min-w-0">
                <div className={`text-sm font-medium truncate ${done?"line-through text-gray-400":"text-gray-800"}`}>{task.text}</div>
                <div className="flex items-center gap-2 mt-0.5 flex-wrap">
                  {showListName && task._listName && <span className="text-xs px-1.5 py-0.5 rounded-full" style={{background:task._listColor+"22",color:task._listColor}}>{task._listName}</span>}
                  <span className="text-xs text-gray-300">📅 {task.createdAt}</span>
                  {task.assignee && <span className="text-xs text-gray-400">👤 {task.assignee}</span>}
                  {task.dueDate && (
                    <span className={`text-xs font-medium ${overdue?"text-ral3000":dueToday?"text-ral3000-mid":"text-gray-400"}`}>
                      {overdue?"⚠️ ":"🏁 "}{task.dueDate}
                    </span>
                  )}
                  {stepsTotal>0 && <span className="text-xs text-gray-400">{stepsDone}/{stepsTotal} ž.</span>}
                  {task.note && <span className="text-xs text-gray-300">📝</span>}
                </div>
              </div>
              <button onClick={e=>{e.stopPropagation();onToggleImportant();}}
                className={`flex-shrink-0 text-base transition-all ${task.important?"text-ral3000-mid":"text-gray-200 hover:text-gray-400"}`}>⭐</button>
            </div>
          );
        }
        // ══ pabaiga: TodoListView ══════════════════════════════════

        function App() {
          const [projects, setProjects] = useState(() => {
            try {
              const s = localStorage.getItem("gantt_projects");
              if (s) return JSON.parse(s);
            } catch(e) {}
            return [{
              id: 1,
              title: "Gamyklos g. 7, Maceniu k., Plunges r.",
              subtitle: "Stacionariosios gaisru gesinimo sistemos ir vidaus gaisrinio vandentiekio montavimo darbu grafikas",
              groups: (() => { try { const s = localStorage.getItem("gantt_groups"); return s ? JSON.parse(s) : initialGroups; } catch(e) { return initialGroups; } })(),
              brigades: (() => { try { const s = localStorage.getItem("gantt_brigades"); return s ? JSON.parse(s) : []; } catch(e) { return []; } })(),
            }];
          });
          const [activeProjectId, setActiveProjectId] = useState(() => {
            try { return parseInt(localStorage.getItem("gantt_active_project")) || 1; } catch(e) { return 1; }
          });
          const [showProjectManager, setShowProjectManager] = useState(false);
          const [editingProjectName, setEditingProjectName] = useState(null);

          // Drag & Drop state
          const [draggedTask, setDraggedTask] = useState(null);
          const [dragOverTask, setDragOverTask] = useState(null);
          const [dragOverGroup, setDragOverGroup] = useState(null);

          const activeProject = projects.find(p => p.id === activeProjectId) || projects[0];
          const groups = activeProject ? activeProject.groups : [];
          const brigades = activeProject ? activeProject.brigades : [];
          const projectTitle = activeProject ? activeProject.title : "";
          const projectSubtitle = activeProject ? activeProject.subtitle : "";

          function setGroups(val) {
            const newGroups = typeof val === "function" ? val(groups) : val;
            setProjects(projects.map(p => p.id === activeProjectId ? { ...p, groups: newGroups } : p));
          }

        // ═══════════════════════════════════════════════
        // BRĖŽINIAI VIEW
        // ═══════════════════════════════════════════════

        // ═══ IndexedDB — brėžinių vaizdų saugykla ═══
        const BREZINIAI_DB = {
          _db: null,
          async open() {
            if (this._db) return this._db;
            return new Promise((res, rej) => {
              const req = indexedDB.open("amteka_breziniai", 1);
              req.onupgradeneeded = e => e.target.result.createObjectStore("images", { keyPath: "id" });
              req.onsuccess = e => { this._db = e.target.result; res(this._db); };
              req.onerror = () => rej(req.error);
            });
          },
          // payload: { imageData: string } arba { pdfBuffer: ArrayBuffer }
          async save(id, payload) {
            const db = await this.open();
            return new Promise((res, rej) => {
              const tx = db.transaction("images", "readwrite");
              tx.objectStore("images").put({ id, ...payload });
              tx.oncomplete = res; tx.onerror = () => rej(tx.error);
            });
          },
          async load(id) {
            const db = await this.open();
            return new Promise((res, rej) => {
              const req = db.transaction("images").objectStore("images").get(id);
              req.onsuccess = () => {
                if (!req.result) { res(null); return; }
                const r = req.result;
                // Senasis formatas: { id, imageData: string }
                if (typeof r.imageData === "string") res({ imageData: r.imageData });
                // Naujasis: { id, pdfBuffer: ArrayBuffer }
                else if (r.pdfBuffer) res({ pdfBuffer: r.pdfBuffer });
                else res(null);
              };
              req.onerror = () => rej(req.error);
            });
          },
          async delete(id) {
            const db = await this.open();
            return new Promise((res, rej) => {
              const tx = db.transaction("images", "readwrite");
              tx.objectStore("images").delete(id);
              tx.oncomplete = res; tx.onerror = () => rej(tx.error);
            });
          },
        };

        // ═══ PDF Viewer — kiekvienas puslapis atskiras canvas ═══
        function PdfPageCanvas({ page }) {
          const divRef = React.useRef(null);
          const [size, setSize] = React.useState({ w: 600, h: 800 });
          React.useEffect(() => {
            if (!page || !divRef.current) return;
            const DPR = window.devicePixelRatio || 1;
            const SCALE = 2 * DPR; // aštrus iki ~200% CSS zoom
            const vp = page.getViewport({ scale: SCALE });
            const cssW = Math.ceil(vp.width / DPR);
            const cssH = Math.ceil(vp.height / DPR);
            setSize({ w: cssW, h: cssH });
            const canvas = document.createElement('canvas');
            canvas.width = Math.ceil(vp.width);
            canvas.height = Math.ceil(vp.height);
            canvas.style.display = 'block';
            canvas.style.width = cssW + 'px';
            canvas.style.height = cssH + 'px';
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            page.render({ canvasContext: ctx, viewport: vp }).promise.then(() => {
              if (divRef.current) { divRef.current.innerHTML = ''; divRef.current.appendChild(canvas); }
            }).catch(e => console.error('PDF render:', e));
          }, [page]);
          return <div ref={divRef} style={{ width: size.w, height: size.h, background: '#fff', flexShrink: 0 }} />;
        }

        function PdfViewer({ pdfBuffer }) {
          const [pdfPages, setPdfPages] = React.useState([]);
          const [err, setErr] = React.useState(null);
          React.useEffect(() => {
            if (!pdfBuffer) return;
            setPdfPages([]); setErr(null);
            const lib = window.pdfjsLib || window['pdfjs-dist/build/pdf'];
            if (!lib) { setErr('PDF.js nepasiekiamas'); return; }
            if (!lib.GlobalWorkerOptions.workerSrc) {
              lib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
            }
            // Naudoti ArrayBuffer tiesiai — greita, nereikia atob
            const copy = pdfBuffer.slice(0); // kopija kad PDF.js nepakeistų
            lib.getDocument({ data: copy }).promise.then(async doc => {
              const ps = [];
              for (let i = 1; i <= doc.numPages; i++) ps.push(await doc.getPage(i));
              setPdfPages(ps);
            }).catch(e => { console.error('PDF load:', e); setErr(e.message); });
          }, [pdfBuffer]);
          if (err) return <div style={{ padding: 20, color: '#dc2626', fontSize: 13 }}>⚠ PDF klaida: {err}</div>;
          if (!pdfPages.length) return (
            <div style={{ width:600, height:400, display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', background:'#f3f4f6', borderRadius:8, color:'#9ca3af' }}>
              <div style={{ fontSize:36, marginBottom:8 }}>⏳</div>
              <div style={{ fontSize:13 }}>Kraunamas PDF...</div>
            </div>
          );
          return (
            <div style={{ display:'flex', flexDirection:'column', gap:16 }}>
              {pdfPages.map((p, i) => <PdfPageCanvas key={i} page={p} />)}
            </div>
          );
        }

              loadedIds.current.add(d.id);

                if (rec) setIdbImages(prev => ({ ...prev, [d.id]: rec }));

          // Visi tasks flat
          const allTasksFlat = useMemo(() => {

          }, [allGroups]);

          function pinColor(pin) {

          }

          // Failo įkėlimas
          function handleFileSelect(e) {
            const file = e.target.files[0]; if (!file) return;
            // Išsaugom file nuorodą prieš bet kokį async veiksmą,
            // nes React sintetinis įvykis nullinamas po pirmojo await
            setUploadFile(file);
            const fileName = file.name;
            const fileType = file.type;
            if (fileType === "application/pdf") {
              // PDF: nuskaityti kaip ArrayBuffer — nereikia base64 konvertavimo
              file.arrayBuffer().then(buf => {
                setUploadPreview({ isPdf: true, buffer: buf, name: fileName });
              }).catch(err => {
                console.error("PDF nuskaitymo klaida:", err);
                alert("Nepavyko nuskaityti PDF: " + err.message);
              });
            } else {
              // Paveikslėlis: nuskaityti kaip data URL
              const reader = new FileReader();
              reader.onload = re => setUploadPreview(re.target.result);
              reader.onerror = () => alert("Nepavyko nuskaityti paveikslėlio.");
              reader.readAsDataURL(file);
            }
          }

          async function handleUpload() {
            if (!uploadPreview || !uploadName.trim()) return;
            setUploading(true);
            const isPdf = uploadPreview && uploadPreview.isPdf;
            let payload = {};

            if (isPdf) {
              payload = { pdfBuffer: uploadPreview.buffer };
            } else {
              payload = { imageData: uploadPreview };

            const newDrawing = {

            try {

              loadedIds.current.add(newDrawing.id);
            } catch(e) {

            setDrawings(d => [...d, newDrawing]);

            setShowUpload(false); setUploading(false);
            setZoom(1); setPan({ x: 0, y: 0 });
          }

          // PDF.js konvertavimas į canvas image
          async function pdfToImage(dataUrl) {
            return new Promise((resolve, reject) => {
              // Rasti pdfjsLib iš galimų globalių
              const lib = window.pdfjsLib || window['pdfjs-dist/build/pdf'];
              if (!lib) { resolve(dataUrl); return; }
              // Nustatyti worker jei dar nenustatytas
              if (!lib.GlobalWorkerOptions.workerSrc) {
                lib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
              }
              // Konvertuoti dataUrl į Uint8Array
              const base64 = dataUrl.split(',')[1];
              const binary = atob(base64);
              const bytes = new Uint8Array(binary.length);
              for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
              lib.getDocument({ data: bytes }).promise.then(pdf => {
                pdf.getPage(1).then(page => {
                  const scale = 4.0;
                  const vp = page.getViewport({ scale });
                  const canvas = document.createElement('canvas');
                  canvas.width = vp.width;
                  canvas.height = vp.height;
                  const ctx = canvas.getContext('2d');
                  page.render({ canvasContext: ctx, viewport: vp }).promise.then(() => {
                    resolve(canvas.toDataURL('image/png'));
                  }).catch(err => { console.error('PDF render error', err); reject(err); });
                }).catch(err => { console.error('PDF getPage error', err); reject(err); });
              }).catch(err => { console.error('PDF getDocument error', err); reject(err); });
            });
          }

            const x = (e.clientX - rect.left - pan.x) / zoom;
            const y = (e.clientY - rect.top - pan.y) / zoom;

            setPlacingPin(false);

          }

          // Pan
          const panMovedRef = useRef(false);

          function handleMouseDown(e) {
            if (placingPin) return;
            if (e.button === 0 || e.button === 1 || e.altKey) {
              setIsPanning(true);
              panMovedRef.current = false;
              setPanStart({ x: e.clientX - pan.x, y: e.clientY - pan.y });
              e.preventDefault();
            }
          }
          function handleMouseMove(e) {
            if (!isPanning) return;
            panMovedRef.current = true;
            setPan({ x: e.clientX - panStart.x, y: e.clientY - panStart.y });
          }
          function handleMouseUp() { setIsPanning(false); }

          // Scroll = zoom į kursorius poziciją
          function handleWheel(e) {
            e.preventDefault();
            const delta = e.deltaY > 0 ? 0.9 : 1.1;
            const rect = containerRef.current ? containerRef.current.getBoundingClientRect() : { left: 0, top: 0 };
            // Kursorius koordinatės konteinerio atžvilgiu
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;
            setZoom(z => {
              const newZoom = Math.max(0.05, Math.min(20, z * delta));
              // Koreguoti pan taip, kad taškas po kursoriumi liktų toje pačioje vietoje
              setPan(p => ({
                x: mouseX - (mouseX - p.x) * (newZoom / z),
                y: mouseY - (mouseY - p.y) * (newZoom / z),
              }));
              return newZoom;
            });
          }

          // Zoom mygtukai — zoom į centro tašką
          function zoomBy(factor) {
            const el = containerRef.current;
            const cx = el ? el.clientWidth / 2 : 400;
            const cy = el ? el.clientHeight / 2 : 300;
            setZoom(z => {
              const newZoom = Math.max(0.05, Math.min(20, z * factor));
              setPan(p => ({
                x: cx - (cx - p.x) * (newZoom / z),
                y: cy - (cy - p.y) * (newZoom / z),
              }));
              return newZoom;
            });
          }

                    return (

                                borderRadius:"50% 50% 50% 0", transform:"rotate(-45deg)",

                                boxShadow: isSelected ? "0 0 0 2px "+col+", 0 4px 12px rgba(0,0,0,0.3)" : "0 2px 6px rgba(0,0,0,0.25)",

                                <div style={{

                          </div>

                            <span style={{ fontSize:11, fontWeight:"700", color:"#1e40af" }}>{selectedPinTask.progress||0}%</span>
                          </div>

                              openEditTask(group.id, selectedPinTask);
                            }}
                            style={{ width:"100%", background:"#596163", color:"#fff", border:"none", borderRadius:6, padding:"6px 0", fontSize:11, fontWeight:"700", cursor:"pointer" }}>
                            ✏️ Redaguoti užduotį →
                          </button>
                        </div>
                      ) : selectedPin.taskId ? (
                        <div style={{ background:"#fef2f2", border:"1px solid #fecaca", borderRadius:6, padding:"8px", fontSize:11, color:"#dc2626", marginBottom:10 }}>Užduotis nerasta (galbūt ištrinta)</div>

                        <div style={{ background:"#f8f9fb", border:"1px dashed #d1d5db", borderRadius:6, padding:"8px", fontSize:11, color:"#9ca3af", marginBottom:10, textAlign:"center" }}>Nepriskirta jokiai užduočiai</div>

                    </div>

                    <div>

                        <div style={{ marginBottom:12 }}>
                          {(() => {
                            const p = selectedDrawing.pins||[];
                            const done = p.filter(x=>{ const t=allTasksFlat.find(t=>t.id==x.taskId); return t&&t.progress>=100; }).length;
                            const inprogress = p.filter(x=>{ const t=allTasksFlat.find(t=>t.id==x.taskId); return t&&t.progress>0&&t.progress<100; }).length;
                            const notStarted = p.filter(x=>{ const t=allTasksFlat.find(t=>t.id==x.taskId); return t&&t.progress===0; }).length;
                            const unlinked = p.filter(x=>!x.taskId).length;
                            return (
                              <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:6 }}>

                              <div style={{ width:9, height:9, borderRadius:"50%", background:pinColor(pin), marginTop:3, flexShrink:0 }} />

                            </div>
                          );

                    </div>

                      <label style={{ fontSize:12, fontWeight:"600", color:"#374151", display:"block", marginBottom:4 }}>Brėžinio pavadinimas *</label>

                      <button onClick={() => { setShowUpload(false); setUploadPreview(null); setUploadFile(null); setUploadName(""); }}
                        style={{ background:"#f3f4f6", border:"none", borderRadius:7, padding:"9px 16px", fontSize:13, cursor:"pointer", color:"#374151" }}>Atšaukti</button>
                    </div>
                  </div>

                useCORS: true,
                backgroundColor: "#ffffff",
                logging: false,
                width: element.scrollWidth,
                height: element.scrollHeight,
                windowWidth: element.scrollWidth,
                windowHeight: element.scrollHeight
              });

              const { jsPDF } = window.jspdf;
              const pdf = new jsPDF({ orientation: "landscape", unit: "mm", format: "a4" });

              const pdfW = 297;
              const pdfH = 210;

              const imgW = canvas.width;
              const imgH = canvas.height;
              const ratio = pdfW / imgW;
              const fullScaledH = imgH * ratio;

              if (fullScaledH <= pdfH + 5) {
                const imgData = canvas.toDataURL("image/jpeg", 0.95);
                const yPos = (pdfH - fullScaledH) / 2;
                pdf.addImage(imgData, "JPEG", 0, yPos, pdfW, fullScaledH);
              } else {
                let currentY = 0;
                const pageHpx = pdfH / ratio;

                while (currentY < imgH) {
                  if (currentY > 0) pdf.addPage();

                  const sliceH = Math.min(pageHpx, imgH - currentY);
                  const sliceCanvas = document.createElement("canvas");
                  sliceCanvas.width = imgW;
                  sliceCanvas.height = sliceH;

                  const ctx = sliceCanvas.getContext("2d");
                  ctx.drawImage(canvas, 0, currentY, imgW, sliceH, 0, 0, imgW, sliceH);

                  const sliceData = sliceCanvas.toDataURL("image/jpeg", 0.95);
                  pdf.addImage(sliceData, "JPEG", 0, 0, pdfW, sliceH * ratio);

                  currentY += sliceH;

            while (d.getMonth() === mo - 1) {

            let basePay=0, overtime=0, dienpinigiai=0, autoNuoma=0;
            if (worker.type === "hourly") {

            } else {
              if (dayCoef !== 1 && entry.dayCoef) {

              } else {

                  basePay = (dailyRate / 8) * hours;
                } else {
                  basePay = dailyRate;

              if (entry.autoNuoma && !entry.noAuto) autoNuoma = wAuto;

              const vacDays  = periodDays.filter(d=>{ const dow=new Date(d).getDay(); return (dow!==0&&dow!==6)&&vacations.some(v=>v.from<=d&&v.to>=d); }).length;
              const mamaDayCount = periodDays.filter(d=>{ const dow=new Date(d).getDay(); return (dow!==0&&dow!==6)&&mamaDays.some(md=>md.date===d); }).length;
              const activeDays = periodDays.filter(d=>parseFloat((wLog[d]||{}).hours)>0);
              const workingDays = activeDays.length;

              const typeLine = worker.type==="hourly"
                ? "Valandinis · "+worker.hourlyRate+" €/val."
                : "Dieninis · "+worker.dailyRate+" €/d. · Viršval. ×"+worker.overtimeCoef
                  +(worker.dienpinigiai?" · Dienpinigiai "+worker.dienpinigiai+" €":"")
                  +(worker.autoNuoma?" · Auto "+worker.autoNuoma+" €":"");

              const kv = (k,v,bold) => [{text:k+": ", fontSize:9, color:"#6b7280"},{text:String(v), fontSize:9, bold:!!bold, color:"#1e293b"}];

              // Suvestinės kortelės
              const statCards = [
                ["Darbo dienos", workingDays],
                ["Valandos", wStats.totalHours+" val."],
                ["Bazinis atlyg.", wStats.basePay.toFixed(2)+" €"],
              ];
              if(wStats.overtime>0) statCards.push(["Viršvalandžiai", "+"+wStats.overtime.toFixed(2)+" €"]);
              if(wStats.dienpinigiai>0) statCards.push(["Dienpinigiai", "+"+wStats.dienpinigiai.toFixed(2)+" €"]);
              if(wStats.autoNuoma>0) statCards.push(["Auto nuoma", "+"+wStats.autoNuoma.toFixed(2)+" €"]);
              if(sickDays>0) statCards.push(["Biuletenis (L)", sickDays+" d."]);
              if(vacDays>0) statCards.push(["Atostogos (A)", vacDays+" d."]);
              if(mamaDayCount>0) statCards.push(["Mamadienis (M)", mamaDayCount+" d."]);
              if(holidayCount>0) statCards.push(["Švenčių d. (ŠV)", holidayCount]);

              // Visos relevantinės dienos (darbo + A + L + M + ŠV + savaitgaliai su valandomis)
              const allRelevantDays = periodDays.filter(d => {
                const dow=new Date(d).getDay();
                const isWE=dow===0||dow===6;
                const hrs=parseFloat((wLog[d]||{}).hours)||0;
                if(isWE) return hrs>0; // savaitgalis – tik jei dirbo
                const isVac=vacations.some(v=>v.from<=d&&v.to>=d);
                const isSick=sickLeaves.some(sl=>sl.from<=d&&sl.to>=d);
                const isMama=mamaDays.some(md=>md.date===d);
                const isHol=holidaySet.has(d);
                return hrs>0||isVac||isSick||isMama||isHol;
              });

              // Dienos eilutės
              let dayTotal={h:0,pay:0,base:0,ot:0,dp:0,au:0,vac:0,sick:0,mama:0,hol:0};
              const hdrCell = (t) => ({text:t, bold:true, fontSize:9, color:"#ffffff", fillColor:BLUE, alignment:"center", margin:[3,4,3,4]});
              const dayRows = allRelevantDays.map((dateStr,di)=>{
                const entry=wLog[dateStr]||{};
                const d=calcDayEntry(worker,entry);
                dayTotal.h+=d.hours; dayTotal.pay+=d.pay; dayTotal.base+=d.basePay;
                dayTotal.ot+=d.overtime; dayTotal.dp+=d.dienpinigiai; dayTotal.au+=d.autoNuoma;
                const dt=new Date(dateStr);
                const dayCoef=parseFloat(entry.dayCoef)||1;
                const isVac=vacations.some(v=>v.from<=dateStr&&v.to>=dateStr);
                const isSick=sickLeaves.some(sl=>sl.from<=dateStr&&sl.to>=dateStr);
                const isMama=mamaDays.some(md=>md.date===dateStr);
                const isHol=holidaySet.has(dateStr);
                const hrs=d.hours;
                if(isVac&&hrs===0) dayTotal.vac++;
                if(isSick&&hrs===0) dayTotal.sick++;
                if(isMama&&hrs===0) dayTotal.mama++;
                if(isHol&&hrs===0) dayTotal.hol++;
                const isWE=dt.getDay()===0||dt.getDay()===6;
                const bg = isWE ? "#e0e7ff" : (di%2===0?GRAY:"#ffffff");
                const cell = (t,align,bold,color) => ({text:String(t), fontSize:9, alignment:align||"left", bold:!!bold, color:color||"#1e293b", fillColor:bg, margin:[3,3,3,3]});
                // Pagrindinis žymėjimas
                let hrCell;
                if(hrs>0) hrCell=cell(String(hrs)+" val.","center",true,GREEN);
                else if(isSick) hrCell={text:"L",fontSize:10,bold:true,alignment:"center",color:"#92400e",fillColor:"#fef3c7",margin:[3,3,3,3]};
                else if(isMama) hrCell={text:"M",fontSize:10,bold:true,alignment:"center",color:"#9d174d",fillColor:"#fce7f3",margin:[3,3,3,3]};
                else if(isVac) hrCell={text:"A",fontSize:10,bold:true,alignment:"center",color:GREEN,fillColor:LGREEN,margin:[3,3,3,3]};
                else if(isHol) hrCell={text:"ŠV",fontSize:9,bold:true,alignment:"center",color:"#991b1b",fillColor:"#fee2e2",margin:[3,3,3,3]};
                else hrCell=cell("—","center");
                return [
                  cell(dateStr),
                  cell(DAYS_LT[dt.getDay()]),
                  hrCell,
                  cell(dayCoef!==1?("×"+dayCoef):"—","center"),
                  // Atostogos
                  (isVac&&hrs===0)?{text:"A",fontSize:9,bold:true,alignment:"center",color:GREEN,fillColor:LGREEN,margin:[3,3,3,3]}:cell("—","center",false,"#d1d5db"),
                  // Biuletenis
                  (isSick&&hrs===0)?{text:"L",fontSize:9,bold:true,alignment:"center",color:"#92400e",fillColor:"#fef3c7",margin:[3,3,3,3]}:cell("—","center",false,"#d1d5db"),
                  // Mamadienis
                  (isMama&&hrs===0)?{text:"M",fontSize:9,bold:true,alignment:"center",color:"#9d174d",fillColor:"#fce7f3",margin:[3,3,3,3]}:cell("—","center",false,"#d1d5db"),
                  // Šventė
                  (isHol&&hrs===0)?{text:"ŠV",fontSize:8,bold:true,alignment:"center",color:"#991b1b",fillColor:"#fee2e2",margin:[3,3,3,3]}:cell("—","center",false,"#d1d5db"),
                  ...(worker.type==="daily"?[
                    cell(entry.dienpinigiai?"✓":"—","center",false,entry.dienpinigiai?"#ea580c":"#9ca3af"),
                    cell(entry.autoNuoma?"✓":"—","center",false,entry.autoNuoma?"#0891b2":"#9ca3af"),
                  ]:[]),
                  cell(d.basePay>0?d.basePay.toFixed(2)+" €":"—","right"),
                  ...(worker.type==="daily"?[cell(d.overtime>0?"+"+d.overtime.toFixed(2)+" €":"—","right",false,d.overtime>0?"#ea580c":"#9ca3af")]:[]),
                  cell(d.pay>0?d.pay.toFixed(2)+" €":"—","right",true,GREEN),
                ];
              });
              // IŠ VISO eilutė
              const totRow = [
                {text:"IŠ VISO",bold:true,fontSize:9,fillColor:LBLUE,margin:[3,3,3,3]},
                {text:"",fillColor:LBLUE},
                {text:dayTotal.h>0?dayTotal.h+" val.":"—",bold:true,fontSize:9,alignment:"center",fillColor:LBLUE,margin:[3,3,3,3]},
                {text:"",fillColor:LBLUE},
                {text:dayTotal.vac>0?String(dayTotal.vac):"—",bold:true,fontSize:9,alignment:"center",color:GREEN,fillColor:LBLUE,margin:[3,3,3,3]},
                {text:dayTotal.sick>0?String(dayTotal.sick):"—",bold:true,fontSize:9,alignment:"center",color:"#92400e",fillColor:LBLUE,margin:[3,3,3,3]},
                {text:dayTotal.mama>0?String(dayTotal.mama):"—",bold:true,fontSize:9,alignment:"center",color:"#9d174d",fillColor:LBLUE,margin:[3,3,3,3]},
                {text:dayTotal.hol>0?String(dayTotal.hol):"—",bold:true,fontSize:9,alignment:"center",color:"#991b1b",fillColor:LBLUE,margin:[3,3,3,3]},
                ...(worker.type==="daily"?[{text:"",fillColor:LBLUE},{text:"",fillColor:LBLUE}]:[]),
                {text:dayTotal.base>0?dayTotal.base.toFixed(2)+" €":"—",bold:true,fontSize:9,alignment:"right",fillColor:LBLUE,margin:[3,3,3,3]},
                ...(worker.type==="daily"?[{text:dayTotal.ot>0?"+"+dayTotal.ot.toFixed(2)+" €":"—",bold:true,fontSize:9,alignment:"right",fillColor:LBLUE,margin:[3,3,3,3]}]:[]),
                {text:dayTotal.pay>0?dayTotal.pay.toFixed(2)+" €":"—",bold:true,fontSize:9,color:GREEN,alignment:"right",fillColor:LBLUE,margin:[3,3,3,3]},
              ];
              dayRows.push(totRow);

              // Stulpelių pločiai ir pavadinimai
              const tHdrs = ["Data","Savaitės diena","Valandos","Koef.","Atost.","Biul.","Mama","ŠV"];
              const tWidths = [64,90,44,28,28,28,28,28];
              if(worker.type==="daily"){ tHdrs.push("D","A"); tWidths.push(22,22); }
              tHdrs.push("Baz. atlyg.");
              tWidths.push(50);
              if(worker.type==="daily"){ tHdrs.push("Viršval."); tWidths.push(36); }
              tHdrs.push("IŠ VISO"); tWidths.push(52);
              const tTotalW = tWidths.reduce((a,b)=>a+b,0);
              const pageOrientation = tTotalW > 539 ? "landscape" : "portrait";
              const usableW = pageOrientation === "landscape" ? 786 : 539;
              const scale = tTotalW > usableW ? usableW/tTotalW : 1;
              const scaledWidths = tWidths.map(w=>Math.floor(w*scale));

              const content = [
                { text:worker.name, fontSize:18, bold:true, color:BLUE },
                { text:worker.role||"Darbuotojas", fontSize:11, color:"#6b7280", margin:[0,2,0,0] },
                { text:brigadeName+" · "+periodLabel, fontSize:9, color:"#9ca3af", margin:[0,2,0,12] },
                { columns:[
                    {stack:[ {text:[...kv("Atlyg. tipas", typeLine)]}, {text:[...kv("Tel.", worker.phone||"—")],margin:[0,3,0,0]} ]},
                    {text:""}
                  ], margin:[0,0,0,12] },
                { text:"Laikotarpio suvestinė", fontSize:12, bold:true, margin:[0,0,0,6] },
                { columns: statCards.map(([k,v])=>({
                    stack:[{text:String(v), fontSize:14, bold:true, color:BLUE},{text:k, fontSize:8, color:"#6b7280"}],
                    alignment:"center", margin:[4,8,4,8], fillColor:LBLUE
                  })), columnGap:6, margin:[0,0,0,6] },
                { table:{widths:["*"], body:[[{text:"IŠ VISO MOKĖTINA: "+wStats.totalPay.toFixed(2)+" €", fontSize:14, bold:true, alignment:"center", color:"#ffffff", fillColor:BLUE, margin:[0,8,0,8]}]]}, layout:"noBorders", margin:[0,0,0,16] },
                { text:"Dienos išklotinė", fontSize:12, bold:true, margin:[0,0,0,6] },
                allRelevantDays.length>0 ? {
                  table:{ widths:scaledWidths, headerRows:1, body:[ tHdrs.map(hdrCell), ...dayRows ] },
                  layout:"noBorders"
                } : { text:"Šiuo laikotarpiu įrašų nebuvo.", fontSize:9, color:"#9ca3af", italics:true },
              ];

              // Biuleteniai
              if(sickLeaves.length>0){
                content.push({ text:"Biuleteniai", fontSize:12, bold:true, margin:[0,16,0,6] });
                const slRows = sickLeaves.sort((a,b)=>b.from.localeCompare(a.from)).map((sl,i)=>{
                  const days=Math.round((new Date(sl.to)-new Date(sl.from))/(864e5))+1;
                  const bg=i%2===0?"#fffbeb":"#ffffff";
                  return [
                    {text:sl.from+" – "+sl.to, fontSize:9, fillColor:bg, margin:[3,3,3,3]},
                    {text:days+" diena(-os)", fontSize:9, alignment:"center", fillColor:bg, margin:[3,3,3,3]},
                    {text:sl.note||"—", fontSize:9, fillColor:bg, margin:[3,3,3,3]},
                  ];
                });
                content.push({ table:{ widths:[120,80,"*"], headerRows:1, body:[
                    ["Laikotarpis","Dienų","Pastaba"].map(t=>({text:t,bold:true,fontSize:9,color:"#ffffff",fillColor:"#b45309",margin:[3,3,3,3]})),
                    ...slRows
                  ]}, layout:"noBorders" });
              }

              content.push({ text:"Sugeneruota: "+new Date().toISOString().split("T")[0], fontSize:7, color:"#999", margin:[0,20,0,0] });

              const wFirstDay = periodDays[0]||"";
              const wMonthCode = wFirstDay.length>=7 ? wFirstDay.substring(0,7).replace("-",".") : periodLabel.replace(/[^\w\.]/g,"_");
              // margins: 1cm sides (28pt), 2cm top/bottom (57pt)
              pdfMake.createPdf({
                pageSize:"A4", pageOrientation, pageMargins:[28,57,28,57],
                content, defaultStyle:{font:"Roboto"}
              }).download((worker.name+" "+wMonthCode+" darbo laiko ataskaita").replace(/[^\wąčęėįšųūžĄČĘĖĮŠŲŪŽ\.\- ]/g,"_")+".pdf");
            } catch(e){alert("PDF klaida: "+e.message);}
          }

          const todayX = todayIndex() * COL_W;
          const totalW = days.length * COL_W;

          return (
            <div className="min-h-screen bg-stone-50 p-4">
              <div className="no-print nav-wrapper flex items-center gap-2 flex-wrap">
                {projects.map(p => (
                  <button
                    key={p.id}
                    onClick={() => setActiveProjectId(p.id)}
                    className={"px-4 py-2 rounded-xl text-sm font-semibold border transition-all " + (p.id === activeProjectId ? "bg-ral3000 text-white border-ral3000 shadow" : "bg-white text-gray-600 border-gray-200 hover:border-ral3000 hover:text-ral3000")}
                  >
                    {p.title || "Objektas " + p.id}
                  </button>
                ))}
                <button
                  onClick={() => setShowProjectManager(true)}
                  className="px-4 py-2 rounded-xl text-sm font-semibold border border-dashed border-gray-300 text-gray-400 hover:border-ral7012 hover:text-ral7012 bg-white transition-all"
                >+ Naujas objektas</button>
                <div className="ml-auto flex gap-0 bg-stone-100 border border-gray-200 rounded-xl overflow-hidden shadow-sm">
                  <button onClick={() => setActiveTab("gantt")} className={"px-4 py-2 text-sm font-semibold transition-all " + (activeTab === "gantt" ? "bg-ral3000 text-white" : "text-gray-600 hover:bg-stone-50")}>📅 Grafikai</button>
                  <button onClick={() => setActiveTab("uzimtumas")} className={"px-4 py-2 text-sm font-semibold transition-all " + (activeTab === "uzimtumas" ? "bg-ral3000 text-white" : "text-gray-600 hover:bg-stone-50")}>📆 Užimtumas</button>
                  <button onClick={() => setActiveTab("ziniarastis")} className={"px-4 py-2 text-sm font-semibold transition-all " + (activeTab === "ziniarastis" ? "bg-ral7012 text-white" : "text-gray-600 hover:bg-stone-50")}>📋 Žiniaraštis</button>
                  <button onClick={() => setActiveTab("apskaita")} className={"px-4 py-2 text-sm font-semibold transition-all " + (activeTab === "apskaita" ? "bg-ral7012 text-white" : "text-gray-600 hover:bg-stone-50")}>⏱ Apskaita</button>
                  <button onClick={() => setActiveTab("automobilis")} className={"px-4 py-2 text-sm font-semibold transition-all " + (activeTab === "automobilis" ? "bg-ral7012 text-white" : "text-gray-600 hover:bg-stone-50")}>🚗 Automobilis</button>
                  <button onClick={() => setActiveTab("darbai")} className={"px-4 py-2 text-sm font-semibold transition-all " + (activeTab === "darbai" ? "bg-ral7012 text-white" : "text-gray-600 hover:bg-stone-50")}>📝 Atl. darbai</button>
                  <button onClick={() => setActiveTab("uzsakymai")} className={"px-4 py-2 text-sm font-semibold transition-all " + (activeTab === "uzsakymai" ? "bg-ral7012-dark text-white" : "text-gray-600 hover:bg-stone-50")}>🛒 Užsakymai</button>
                  <button onClick={() => setActiveTab("sandelis")} className={"px-4 py-2 text-sm font-semibold transition-all " + (activeTab === "sandelis" ? "bg-ral7012-dark text-white" : "text-gray-600 hover:bg-stone-50")}>🏪 Sandėlis</button>
                  <button onClick={() => setActiveTab("prasymai")} className={"px-4 py-2 text-sm font-semibold transition-all " + (activeTab === "prasymai" ? "bg-ral3000 text-white" : "text-gray-600 hover:bg-stone-50")}>📄 Prašymai</button>
                  <button onClick={() => setActiveTab("todolist")} className={"px-4 py-2 text-sm font-semibold transition-all " + (activeTab === "todolist" ? "bg-ral7012 text-white" : "text-gray-600 hover:bg-stone-50")}>✅ To Do List</button>
                  <button onClick={() => setActiveTab("breziniai")} className={"px-4 py-2 text-sm font-semibold transition-all " + (activeTab === "breziniai" ? "bg-ral3000 text-white" : "text-gray-600 hover:bg-stone-50")}>📐 Brėžiniai</button>
                </div>
              </div>
              
              {activeTab === "gantt" && (
              <div>
              <div className="bg-white rounded-xl shadow p-4 mb-4" ref={ganttRef}>
                <div className="flex flex-wrap gap-4 items-start justify-between mb-2">
                  <div className="flex-1 min-w-64">
                    <input className="font-bold text-xl text-gray-800 border-b border-transparent hover:border-gray-300 focus:border-ral3000 outline-none w-full mb-1" value={projectTitle} onChange={e => setProjectTitle(e.target.value)} />
                    <input className="text-sm text-gray-600 border-b border-transparent hover:border-gray-300 focus:border-ral3000 outline-none w-full" value={projectSubtitle} onChange={e => setProjectSubtitle(e.target.value)} />
                  </div>
                  <div className="text-right text-sm text-gray-500 flex flex-col items-end gap-1">
                    <div className="font-semibold text-gray-700">Siandien: {formatDate(today)}</div>
                    <div className={`flex items-center gap-1.5 text-xs font-medium transition-all duration-300 ${saveStatus === "saved" ? "text-ral7012" : "text-ral3000-mid"}`}>
                      {saveStatus === "saved" ? (
                        <>
                          <span className="flex items-center justify-center w-5 h-5 rounded-full bg-ral7012-subtle border border-ral7012-light">
                            <svg width="11" height="11" viewBox="0 0 12 12" fill="none"><path d="M2 6.5l3 3 5-5" stroke="#16a34a" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>
                          </span>
                          <span>Issaugota</span>
                        </>
                      ) : (
                        <>
                          <span className="flex items-center justify-center w-5 h-5 rounded-full bg-ral3000-subtle border border-yellow-400 animate-spin" style={{animationDuration:"1s"}}>
                            <svg width="11" height="11" viewBox="0 0 12 12" fill="none"><path d="M6 2v2M6 8v2M2 6h2M8 6h2" stroke="#ca8a04" strokeWidth="1.8" strokeLinecap="round"/></svg>
                          </span>
                          <span>Saugoma...</span>
                        </>
                      )}
                    </div>
                  </div>
                </div>

                <div className="bg-white rounded-xl shadow overflow-hidden mt-2">
                  <div className="overflow-x-auto" ref={scrollRef}>
                    <div style={{ minWidth: LEFT_W + totalW + 40 }}>
                      <div className="flex border-b border-gray-200 bg-stone-50">
                        <div style={{ minWidth: LEFT_W, width: LEFT_W }} className="flex border-r border-gray-200 sticky-left bg-stone-50">
                          <div className="flex items-center px-3 py-2 font-semibold text-xs text-gray-600 uppercase tracking-wide" style={{ width: 260 }}>Pavadinimas</div>
                          <div className="flex items-center justify-center px-1 py-2 font-semibold text-xs text-gray-600 uppercase tracking-wide border-l border-gray-200" style={{ width: 60 }}>Ivykdyta</div>
                          <div className="flex items-center justify-center px-1 py-2 font-semibold text-xs text-gray-600 uppercase tracking-wide border-l border-gray-200" style={{ width: 90 }}>Pradzia</div>
                          <div className="flex items-center justify-center px-1 py-2 font-semibold text-xs text-gray-600 uppercase tracking-wide border-l border-gray-200" style={{ width: 90 }}>Pabaiga</div>
                          <div className="flex items-center justify-center px-1 py-2 font-semibold text-xs text-gray-600 uppercase tracking-wide border-l border-gray-200" style={{ width: 50 }}>Dienos</div>
                          <div className="flex items-center justify-center px-1 py-2 font-semibold text-xs text-gray-600 uppercase tracking-wide border-l border-gray-200" style={{ width: 110 }}>Darbuotojai</div>
                        </div>
                        <div className="relative" style={{ width: totalW }}>
                          <div className="flex" style={{ height: 22 }}>
                            {weekSegments.map((seg, i) => {
                              const ww = (seg.endIdx - seg.startIdx) * COL_W;
                              const w = seg.labelDate;
                              return (
                                <div key={i} style={{ width: ww, minWidth: ww }} className="border-r border-gray-200 text-center text-xs font-semibold text-gray-600 py-1 overflow-hidden whitespace-nowrap">
                                  {MONTH_NAMES_LT[w.getMonth()]} {w.getDate()}, {w.getFullYear()}
                                </div>
                              );
                            })}
                          </div>
                          <div className="flex" style={{ height: 20 }}>
                            {days.map((d, i) => (<div key={i} style={{ width: COL_W, minWidth: COL_W }} className={`border-r border-gray-100 text-center text-xs py-0.5 ${d.getDay() === 0 || d.getDay() === 6 ? "bg-stone-100 text-gray-400" : "text-gray-500"}`}>{d.getDate()}</div>))}
                          </div>
                          <div className="flex" style={{ height: 16 }}>
                            {days.map((d, i) => (<div key={i} style={{ width: COL_W, minWidth: COL_W }} className={`border-r border-gray-100 text-center text-xs ${d.getDay() === 0 || d.getDay() === 6 ? "bg-stone-100 text-gray-400" : "text-gray-400"}`}>{DAY_NAMES_LT[d.getDay()]}</div>))}
                          </div>
                        </div>
                      </div>
                      
                      {groups.map((group, gIdx) => (
                        <div key={group.id}>
                          <div 
                            className={`flex border-b border-gray-200 cursor-pointer hover:bg-purple-50 transition-colors group-header ${dragOverGroup === gIdx ? 'drag-over' : ''}`}
                            style={{ background: "#f8f6ff" }}
                            onClick={() => openEditGroup(group)}
                            onDragOver={(e) => handleDragOver(e, "group", gIdx)}
                            onDrop={(e) => handleDrop(e, gIdx, null)}
                          >
                            <div style={{ minWidth: LEFT_W, width: LEFT_W }} className="flex items-center border-r border-gray-200 sticky-left bg-[#f8f6ff]">
                              <div className="flex items-center gap-2 px-3 py-2 font-bold text-sm text-gray-800 flex-1" style={{ width: 260 }}>
                                <div className="w-3 h-3 rounded-full flex-shrink-0" style={{ background: group.color }}></div>
                                {group.name}
                                <span className="ml-1 text-gray-400 text-xs font-normal">(✏️)</span>
                              </div>
                              <div className="border-l border-gray-200 flex items-center justify-center" style={{ width: 60 }}></div>
                              <div className="border-l border-gray-200 flex items-center justify-center" style={{ width: 90 }}></div>
                              <div className="border-l border-gray-200 flex items-center justify-center" style={{ width: 90 }}></div>

                getWeekLabel={getWeekLabel}
                shiftWeek={shiftWeek}
                activeProject={activeProject}
              />
              )}

              {activeTab === "uzsakymai" && activeProject && (
              <UzsakymaiView
                ziniarastis={activeProjectZiniarastis}
                projectTitle={projectTitle}
                projects={projects}
                activeProjectId={activeProjectId}
                setProjects={setProjects}
              />
              )}

              {activeTab === "sandelis" && activeProject && (
              <SandelisView
                ziniarastis={activeProjectZiniarastis}
                projects={projects}
                activeProjectId={activeProjectId}
              />
              )}

              {activeTab === "prasymai" && (
              <PrasymaiFView
                allWorkers={allWorkers}
                projects={projects}
                activeProjectId={activeProjectId}
                setProjects={setProjects}
              />
              )}

              {activeTab === "todolist" && (
              <TodoListView
                projects={projects}
                activeProjectId={activeProjectId}
                setProjects={setProjects}
              />
              )}

              {activeTab === "breziniai" && activeProject && (
              <BreziniaiView
                activeProject={activeProject}
                setProjects={setProjects}
                projects={projects}
                activeProjectId={activeProjectId}
                allGroups={groups}
                openEditTask={openEditTask}
                setEditingTask={setEditingTask}
                setEditTask={setEditTask}
                setEditTaskTab={setEditTaskTab}
              />
              )}

              {/* Modals (visi lieka tokie patys) */}
              {editingTask && editTask && (
                <Modal title="Redaguoti užduotį" onClose={() => setEditingTask(null)} wide={true} resizable={true}>
                  {/* ═══ TAB BAR ═══ */}
                  <div className="flex gap-0 border-b border-gray-200 mb-3 -mt-1">
                    {[
                      {id:"pagrindinis", label:"📝 Pagrindiniai"},
                      {id:"darbuotojai", label:"👷 Darbuotojai"},
                      {id:"checklist",   label:"✅ Checklist"},
                      {id:"subtasks",    label:"📋 Subtasks"},
                    ].map(tab => (
                      <button key={tab.id} onClick={() => setEditTaskTab(tab.id)}
                        className={"px-4 py-2 text-xs font-semibold border-b-2 transition-all " + (editTaskTab===tab.id ? "border-ral3000 text-ral3000 bg-ral3000-subtle" : "border-transparent text-gray-500 hover:text-gray-700 hover:bg-stone-50")}>
                        {tab.label}
                      </button>
                    ))}
                  </div>

                  {/* ═══ LAPAS: PAGRINDINIAI ═══ */}
                  {editTaskTab === "pagrindinis" && (
                    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
                      <div style={{display:"flex",flexDirection:"column",gap:8}}>
                        <div>
                          <label className="block text-xs font-semibold text-gray-600 mb-1">Pavadinimas</label>
                          <textarea className="w-full border rounded-lg px-2 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-ral3000-light" rows={2} value={editTask.name} onChange={e => setEditTask({ ...editTask, name: e.target.value })} />
                        </div>
                        <div style={{display:"flex",gap:6}}>
                          <div style={{flex:1}}>
                            <label className="block text-xs font-semibold text-gray-600 mb-1">Progresas (%)</label>
                            <input type="number" min={0} max={100} className="w-full border rounded-lg px-2 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-ral3000-light" value={editTask.progress} onChange={e => setEditTask({ ...editTask, progress: e.target.value })} />
                          </div>
                          <div style={{flex:1}}>
                            <label className="block text-xs font-semibold text-gray-600 mb-1">Spalva</label>
                            <div style={{width:"100%"}}>
                              <div className="flex flex-wrap gap-1 mb-1" style={{maxHeight:60,overflowY:"auto"}}>
                                {allModalColors.map(c => (
                                  <button key={c.value} onClick={() => setEditTask({...editTask, color: c.value})}
                                    className="rounded-full border-2 transition-all flex-shrink-0"
                                    style={{width:18,height:18,background:c.value,borderColor:(editTask.color||"")===c.value?"#1c1c1c":"transparent"}}
                                    title={c.label} />
                                ))}
                                <button onClick={() => setShowColorPickerModal(p=>!p)} className="rounded-full border-2 border-dashed border-gray-300 flex items-center justify-center flex-shrink-0" style={{width:18,height:18,fontSize:11}} title="Pridėti spalvą">+</button>
                              </div>
                              {showColorPickerModal && (
                                <div className="flex items-center gap-1 mt-1">
                                  <input type="color" value={newCustomColor} onChange={e=>setNewCustomColor(e.target.value)} style={{width:24,height:24,padding:0,border:"none",cursor:"pointer"}} />
                                  <button onClick={() => {
                                    const nc = {label:"Pasirinktinė", value: newCustomColor};
                                    const updated = [...customColors, nc];
                                    setCustomColors(updated);
                                    localStorage.setItem("gantt_custom_colors", JSON.stringify(updated));
                                    setEditTask({...editTask, color: newCustomColor});
                                    setShowColorPickerModal(false);
                                  }} className="text-xs px-2 py-0.5 bg-ral3000-subtle text-ral3000 rounded">Pridėti</button>
                                </div>
                              )}
                              <button onClick={() => setEditTask({ ...editTask, color: "" })} className="text-xs text-ral3000 hover:underline mt-0.5">Grupės spalva</button>
                            </div>
                          </div>
                        </div>
                        <div style={{display:"flex",gap:6}}>
                          <div style={{flex:1}}>
                            <label className="block text-xs font-semibold text-gray-600 mb-1">Pradžia</label>
                            <input type="date" className="w-full border rounded-lg px-2 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-ral3000-light" value={editTask.start} onChange={e => setEditTask({ ...editTask, start: e.target.value })} />
                          </div>
                          <div style={{flex:1}}>
                            <label className="block text-xs font-semibold text-gray-600 mb-1">Pabaiga</label>
                            <input type="date" className="w-full border rounded-lg px-2 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-ral3000-light" value={editTask.end} onChange={e => setEditTask({ ...editTask, end: e.target.value })} />
                          </div>
                        </div>
                        <div className="text-xs text-gray-500">Dienų: <strong>{diffDays(editTask.start, editTask.end)}</strong></div>
                      </div>
                      <div style={{display:"flex",flexDirection:"column",gap:8}}>
                        <div className="flex items-center justify-between">
                          <span className="text-xs font-bold text-orange-600">Pratęsimai</span>
                          <button onClick={() => {
                              const exts = editTask.extensions || [];
                              const lastEnd = exts.length > 0 ? exts[exts.length-1].end : editTask.end;
                              const [y,m,d] = lastEnd.split('-').map(Number);
                              const nd = new Date(y,m-1,d+7);
                              const newEnd = nd.getFullYear()+'-'+String(nd.getMonth()+1).padStart(2,'0')+'-'+String(nd.getDate()).padStart(2,'0');
                              setEditTask({ ...editTask, extensions: [...(editTask.extensions||[]), { id: Date.now(), start: lastEnd, end: newEnd, comment: "" }] });
                            }}
                            className="text-xs px-2 py-0.5 rounded bg-orange-100 hover:bg-orange-200 text-orange-700 font-semibold"
                          >+ Pratęsimas</button>
                        </div>
                        {(editTask.extensions||[]).length === 0 && <p className="text-xs text-gray-400 italic">Nėra pratęsimų</p>}
                        <div className="space-y-2 max-h-64 overflow-y-auto pr-1">
                        {(editTask.extensions||[]).map((ext, ei) => (
                          <div key={ext.id} className="bg-orange-50 border border-orange-200 rounded-lg p-2 space-y-1.5">
                            <div className="flex items-center justify-between">
                              <span className="text-xs font-semibold text-orange-700">#{ei+1} — {diffDays(ext.start, ext.end)} d.</span>
                              <button onClick={() => setEditTask({ ...editTask, extensions: editTask.extensions.filter((_,i)=>i!==ei) })} className="text-xs text-red-400 hover:text-ral3000">× Šalinti</button>
                            </div>
                            <div className="flex gap-2">
                              <div className="flex-1"><label className="block text-xs text-gray-500 mb-0.5">Pradžia</label>
                                <input type="date" className="w-full border rounded px-2 py-1 text-xs" value={ext.start} onChange={e => setEditTask({ ...editTask, extensions: editTask.extensions.map((x,i)=>i===ei?{...x,start:e.target.value}:x) })} /></div>
                              <div className="flex-1"><label className="block text-xs text-gray-500 mb-0.5">Pabaiga</label>
                                <input type="date" className="w-full border rounded px-2 py-1 text-xs" value={ext.end} onChange={e => setEditTask({ ...editTask, extensions: editTask.extensions.map((x,i)=>i===ei?{...x,end:e.target.value}:x) })} /></div>
                            </div>
                            <div><label className="block text-xs text-gray-500 mb-0.5">Komentaras</label>
                              <textarea rows={1} className="w-full border rounded px-2 py-1 text-xs" placeholder="pvz. Medžiagų trūkumas..." value={ext.comment} onChange={e => setEditTask({ ...editTask, extensions: editTask.extensions.map((x,i)=>i===ei?{...x,comment:e.target.value}:x) })} /></div>
                            <div>
                              <label className="block text-xs text-gray-500 mb-1">Priedai</label>
                              <div className="flex gap-2 mb-1">
                                <label className="flex-1 flex items-center justify-center gap-1 cursor-pointer border border-dashed border-orange-300 rounded px-2 py-1 text-xs text-orange-600 hover:bg-orange-50">📎 Failas
                                  <input type="file" className="hidden" accept="image/*,application/pdf,.doc,.docx,.xls,.xlsx,.txt"
                                    onChange={ev => {
                                      const file = ev.target.files[0]; if (!file) return;
                                      const reader = new FileReader();
                                      reader.onload = re => {
                                        const att = { id: Date.now(), type: 'file', name: file.name, mimeType: file.type, dataUrl: re.target.result };
                                        setEditTask({ ...editTask, extensions: editTask.extensions.map((x,i)=>i===ei?{...x,attachments:[...(x.attachments||[]),att]}:x) });
                                      };
                                      reader.readAsDataURL(file); ev.target.value='';
                                    }} />
                                </label>
                                <button className="flex-1 border border-dashed border-ral3000-light rounded px-2 py-1 text-xs text-ral3000 hover:bg-ral3000-subtle"
                                  onClick={() => {
                                    const url = prompt('Įveskite nuorodą (URL):');
                                    if (!url || !url.trim()) return;
                                    const att = { id: Date.now(), type: 'url', name: url.trim(), url: url.trim() };
                                    setEditTask({ ...editTask, extensions: editTask.extensions.map((x,i)=>i===ei?{...x,attachments:[...(x.attachments||[]),att]}:x) });
                                  }}>🔗 Nuoroda</button>
                              </div>
                              {(ext.attachments||[]).length > 0 && (
                                <div className="space-y-1">
                                  {(ext.attachments||[]).map((att, ai) => (
                                    <div key={att.id} className="flex items-center gap-1 bg-white border border-gray-200 rounded px-2 py-1">
                                      <span className="text-xs flex-1 truncate">{att.type==='url'?'🔗':'📄'} {att.name}</span>
                                      <button className="text-xs text-blue-500 hover:text-ral3000 px-1" onClick={() => setPreviewAttachment(att)}>Peržiūra</button>
                                      <button className="text-xs text-red-400 hover:text-ral3000 px-1" onClick={() => setEditTask({ ...editTask, extensions: editTask.extensions.map((x,i)=>i===ei?{...x,attachments:(x.attachments||[]).filter((_,j)=>j!==ai)}:x) })}>×</button>
                                    </div>
                                  ))}
                                </div>
                              )}
                            </div>
                          </div>
                        ))}
                        </div>
                      </div>
                    </div>
                  )}

                  {/* ═══ LAPAS: DARBUOTOJAI — MATRICA ═══ */}
                  {editTaskTab === "darbuotojai" && (() => {
                    const matDays = [];
                    if (editTask.start && editTask.end) {
                      // Pagrindinė užduoties trukmė
                      const cur = parseDate(editTask.start);
                      const end = parseDate(editTask.end);
                      while (cur <= end) { matDays.push(formatDate(cur)); cur.setDate(cur.getDate() + 1); }
                      // Pratęsimai
                      (editTask.extensions||[]).forEach(ext => {
                        if (!ext.start || !ext.end) return;
                        const ec = parseDate(ext.start);
                        const ee = parseDate(ext.end);
                        while (ec <= ee) {
                          const ds = formatDate(ec);
                          if (!matDays.includes(ds)) matDays.push(ds);
                          ec.setDate(ec.getDate() + 1);
                        }
                      });
                      // Rūšiuoti chronologiškai
                      matDays.sort();
                    }
                    const schedule = editTask.workerSchedule || {};
                    function toggleCell(wId, dateStr) {
                      const ws = JSON.parse(JSON.stringify(schedule));
                      if (!ws[wId]) ws[wId] = {};
                      ws[wId][dateStr] = !ws[wId][dateStr];
                      setEditTask({ ...editTask, workerSchedule: ws });
                    }
                    function toggleRow(wId) {
                      const rowData = schedule[wId] || {};
                      const allOn = matDays.every(d => rowData[d]);
                      const ws = JSON.parse(JSON.stringify(schedule));
                      ws[wId] = {};
                      matDays.forEach(d => { ws[wId][d] = !allOn; });
                      setEditTask({ ...editTask, workerSchedule: ws });
                    }
                    function toggleCol(dateStr) {
                      const ws = JSON.parse(JSON.stringify(schedule));
                      const allOn = allWorkers.every(w => (ws[w.id] || {})[dateStr]);
                      allWorkers.forEach(w => {
                        if (!ws[w.id]) ws[w.id] = {};
                        ws[w.id][dateStr] = !allOn;
                      });
                      setEditTask({ ...editTask, workerSchedule: ws });
                    }
                    function getDayWorkerCount(dateStr) {
                      return allWorkers.filter(w => (schedule[w.id]||{})[dateStr]).length;
                    }
                    const MNAMES = ["Sau","Vas","Kov","Bal","Geg","Bir","Lie","Rgp","Rgs","Spa","Lap","Gruo"];
                    const DNAMES = ["S","P","A","T","K","P","Š"];
                    if (allWorkers.length === 0) return (
                      <div className="flex flex-col items-center justify-center py-12 text-gray-400">
                        <div style={{fontSize:40,marginBottom:8}}>👷</div>
                        <p className="text-sm font-semibold">Nėra darbuotojų</p>
                        <p className="text-xs mt-1">Pridėkite darbuotojų Apskaitos skiltyje</p>
                      </div>
                    );
                    if (matDays.length === 0) return <p className="text-xs text-gray-400 py-4 text-center">Nustatykite užduoties pradžios ir pabaigos datas</p>;
                    const CELL_W = 32; const NAME_W = 185;
                    return (
                      <div>
                        <div className="flex items-center justify-between mb-2 flex-wrap gap-2">
                          <span className="text-xs text-gray-500 font-semibold">
                            {matDays.length} dienų · {allWorkers.length} darbuotojų
                            {(editTask.extensions||[]).length > 0 && <span className="ml-2 text-orange-500">(+ {(editTask.extensions||[]).length} pratęsimas)</span>}
                          </span>
                          <div className="flex gap-2">
                            <button onClick={() => setEditTask({ ...editTask, workerSchedule: {} })}
                              className="text-xs px-2 py-1 bg-stone-100 hover:bg-gray-200 text-gray-500 rounded">Išvalyti</button>
                            <button onClick={() => {
                              const ws = {};
                              allWorkers.forEach(w => {
                                ws[w.id] = {};
                                matDays.forEach(d => { const dow = parseDate(d).getDay(); ws[w.id][d] = dow!==0 && dow!==6; });
                              });
                              setEditTask({ ...editTask, workerSchedule: ws });
                            }} className="text-xs px-2 py-1 bg-ral7012-subtle hover:bg-green-100 text-ral7012-dark rounded font-semibold">Visos darbo dienos</button>
                          </div>
                        </div>
                        <div style={{overflowX:"auto", overflowY:"auto", maxHeight:"55vh"}}>
                          <table style={{borderCollapse:"collapse", tableLayout:"fixed"}}>
                            <thead style={{position:"sticky", top:0, zIndex:10, background:"#fff"}}>
                              <tr>
                                <th style={{width:NAME_W, minWidth:NAME_W, position:"sticky", left:0, background:"#fff", zIndex:11, borderBottom:"1px solid #e5e7eb", borderRight:"2px solid #e5e7eb", padding:"4px 8px", textAlign:"left"}}>
                                  <span style={{fontSize:11, fontWeight:"bold", color:"#596163"}}>Darbuotojas</span>
                                </th>
                                {(() => {
                                  const segs = []; let cur = null; let cnt = 0;
                                  matDays.forEach(d => {
                                    const mo = d.substring(0,7);
                                    if (mo !== cur) { if (cur) segs.push({mo:cur,cnt}); cur=mo; cnt=1; } else cnt++;
                                  });
                                  if (cur) segs.push({mo:cur,cnt});
                                  return segs.map(seg => {
                                    const [y,m] = seg.mo.split('-').map(Number);
                                    return (
                                      <th key={seg.mo} colSpan={seg.cnt} style={{background:"#f8f6ff", borderBottom:"1px solid #e5e7eb", borderLeft:"1px solid #e5e7eb", padding:"3px 4px", textAlign:"center"}}>
                                        <span style={{fontSize:11, fontWeight:"bold", color:"#596163"}}>{MNAMES[m-1]} {y}</span>
                                      </th>
                                    );
                                  });
                                })()}
                              </tr>
                              <tr>
                                <th style={{width:NAME_W, minWidth:NAME_W, position:"sticky", left:0, background:"#fff", zIndex:11, borderBottom:"2px solid #e5e7eb", borderRight:"2px solid #e5e7eb", padding:"2px 8px"}}></th>
                                {matDays.map(d => {
                                  const dt = parseDate(d);
                                  const dow = dt.getDay();
                                  const isWe = dow===0 || dow===6;
                                  const isTd = d === todayStr;
                                  return (
                                    <th key={d} onClick={() => toggleCol(d)} title={"Perjungti: "+d}
                                      style={{width:CELL_W, minWidth:CELL_W, padding:"2px 0", borderBottom:"2px solid #e5e7eb", borderRight:"1px solid #f0f0f0",
                                        background: isTd ? "#fef3c7" : isWe ? "#f5f5f5" : "#fff", cursor:"pointer", textAlign:"center"}}>
                                      <div style={{fontSize:9, color: isWe?"#9ca3af":"#6b7280", lineHeight:1.2}}>{DNAMES[dow]}</div>
                                      <div style={{fontSize:11, fontWeight:"bold", color: isTd?"#b45309": isWe?"#9ca3af":"#374151", lineHeight:1.2}}>{dt.getDate()}</div>
                                    </th>
                                  );
                                })}
                              </tr>
                            </thead>
                            <tbody>
                              {allWorkers.map((w, wi) => {
                                const rowData = schedule[w.id] || {};
                                const workedDays = matDays.filter(d => rowData[d]).length;
                                return (
                                  <tr key={w.id} style={{background: wi%2===0?"#fff":"#fafafa"}}>
                                    <td onClick={() => toggleRow(w.id)} title="Perjungti eilutę"
                                      style={{position:"sticky", left:0, zIndex:5, background: wi%2===0?"#fff":"#fafafa",
                                        borderRight:"2px solid #e5e7eb", borderBottom:"1px solid #f0f0f0", padding:"4px 8px", cursor:"pointer", whiteSpace:"nowrap"}}>
                                      <div style={{display:"flex", alignItems:"center", gap:6}}>
                                        <div style={{width:7, height:7, borderRadius:"50%", background:workedDays>0?"#596163":"#d1d5db", flexShrink:0}}></div>
                                        <span style={{fontSize:12, fontWeight:"600", color:"#1c1c1c"}}>{w.name}</span>
                                        {w.role && <span style={{fontSize:10, color:"#9ca3af", marginLeft:4}}>{w.role}</span>}
                                        <span style={{fontSize:10, color:"#596163", fontWeight:"bold", marginLeft:"auto", paddingLeft:8}}>{workedDays}d</span>
                                      </div>
                                    </td>
                                    {matDays.map(d => {
                                      const isOn = !!(rowData[d]);
                                      const dt = parseDate(d);
                                      const dow = dt.getDay();
                                      const isWe = dow===0 || dow===6;
                                      const isTd = d===todayStr;
                                      return (
                                        <td key={d} onClick={() => toggleCell(w.id, d)}
                                          style={{width:CELL_W, minWidth:CELL_W, height:30,
                                            borderBottom:"1px solid #f0f0f0", borderRight:"1px solid #f0f0f0",
                                            background: isOn ? "#596163" : isTd ? "#fef9c3" : isWe ? "#f5f5f5" : "#fff",
                                            cursor:"pointer", textAlign:"center", verticalAlign:"middle", transition:"background 0.1s"}}>
                                          {isOn && (
                                            <svg width="12" height="10" viewBox="0 0 12 10" fill="none" style={{margin:"0 auto", display:"block"}}>
                                              <path d="M1 5l3.5 3.5L11 1" stroke="white" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>
                                            </svg>
                                          )}
                                        </td>
                                      );
                                    })}
                                  </tr>
                                );
                              })}
                              <tr style={{background:"#f0f0f0", position:"sticky", bottom:0}}>
                                <td style={{position:"sticky", left:0, zIndex:5, background:"#f0f0f0", borderRight:"2px solid #e5e7eb", borderTop:"2px solid #e5e7eb", padding:"3px 8px"}}>
                                  <span style={{fontSize:11, fontWeight:"bold", color:"#596163"}}>Viso / dieną:</span>
                                </td>
                                {matDays.map(d => {
                                  const cnt = getDayWorkerCount(d);
                                  const isWe = parseDate(d).getDay()===0 || parseDate(d).getDay()===6;
                                  return (
                                    <td key={d} style={{textAlign:"center", borderRight:"1px solid #e5e7eb", borderTop:"2px solid #e5e7eb",
                                      background: cnt>0 ? "#d4e8e2" : isWe ? "#ebebeb" : "#f0f0f0", height:26}}>
                                      <span style={{fontSize:11, fontWeight:"bold", color: cnt>0?"#2e7d32":"#9ca3af"}}>{cnt>0?cnt:""}</span>
                                    </td>
                                  );
                                })}
                              </tr>
                            </tbody>
                          </table>
                        </div>
                        <div className="mt-2 flex gap-4 text-xs text-gray-400 flex-wrap">
                          <span className="flex items-center gap-1"><span style={{display:"inline-block",width:12,height:12,background:"#596163",borderRadius:2}}></span>Dirba</span>
                          <span className="flex items-center gap-1"><span style={{display:"inline-block",width:12,height:12,background:"#f5f5f5",border:"1px solid #e5e7eb",borderRadius:2}}></span>Savaitgalis</span>
                          <span className="flex items-center gap-1"><span style={{display:"inline-block",width:12,height:12,background:"#fef9c3",border:"1px solid #fcd34d",borderRadius:2}}></span>Šiandien</span>
                          <span className="ml-auto">Spustelkite langelį / eilutę / stulpelį — perjungti</span>
                        </div>
                      </div>
                    );
                  })()}

                  {/* ═══ LAPAS: CHECKLIST ═══ */}
                  {editTaskTab === "checklist" && (
                    <div>
                      <div className="flex items-center justify-between mb-2">
                        <span className="text-xs text-gray-500">Kasdienė apskaita ir progresas</span>
                        <button onClick={() => {
                          const items = editTask.checklist||[];
                          setEditTask({...editTask, checklist:[...items,{id:Date.now(),name:"",unit:"vnt.",qty:1,dailyLog:{}}]});
                        }} className="text-xs px-3 py-1 bg-ral7012-subtle text-ral7012-dark rounded hover:bg-green-100 font-semibold">+ Pridėti</button>
                      </div>
                      {(editTask.checklist||[]).length===0 && (
                        <div className="flex flex-col items-center py-10 text-gray-400">
                          <div style={{fontSize:40,marginBottom:8}}>✅</div>
                          <p className="text-sm">Nėra checklist elementų</p>
                        </div>
                      )}
                      <div className="space-y-2 max-h-96 overflow-y-auto pr-1">
                        {(editTask.checklist||[]).map((item,ci) => {
                          const todayKey = new Date().toISOString().split("T")[0];
