                  <div className="space-y-3">
                    <div>
                      <label className="block text-xs font-semibold text-gray-600 mb-1">Grupes pavadinimas</label>
                      <input className="w-full border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-ral3000-light" value={newGroupName} onChange={e => setNewGroupName(e.target.value)} placeholder="pvz. VGV (gamybines patalpos)" />
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-gray-600 mb-1">Spalva</label>
                      <div className="flex flex-wrap gap-1.5 mb-2" style={{maxHeight:72,overflowY:"auto"}}>
                        {allModalColors.map(c => (<button key={c.value} onClick={() => setNewGroupColor(c.value)} className={`rounded-full border-4 transition-all flex-shrink-0 ${newGroupColor === c.value ? "border-gray-800" : "border-transparent"}`} style={{ width:26,height:26, background: c.value }} title={c.label} />))}
                      </div>
                      <div className="flex items-center gap-2 mt-1">
                        <label className="text-xs text-gray-500">HEX:</label>
                        <input type="text" className="border rounded px-2 py-1 text-xs w-28" value={newGroupColor} onChange={e => setNewGroupColor(e.target.value)} placeholder="#rrggbb" />
                        <div className="w-6 h-6 rounded border" style={{ background: newGroupColor }}></div>
                      </div>
                    </div>
                    <div className="flex gap-2 pt-2">
                      <button onClick={saveAddGroup} className="flex-1 bg-ral7012 hover:bg-ral7012-dark text-white rounded-lg py-2 text-sm font-semibold">Prideti grupe</button>
                      <button onClick={() => setAddingGroup(false)} className="px-4 bg-stone-100 hover:bg-gray-200 text-gray-600 rounded-lg py-2 text-sm">Atsaukti</button>
                    </div>
                  </div>
                </Modal>
              )}
              
              {showProjectManager && (
                <Modal title="Objektu valdymas" onClose={() => { setShowProjectManager(false); setEditingProjectName(null); }}>
                  <div className="space-y-3">
                    <div className="max-h-64 overflow-y-auto space-y-2">
                      {projects.map(p => (
                        <div key={p.id} className={"flex items-center gap-2 p-2 rounded-lg border " + (p.id === activeProjectId ? "border-ral3000-light bg-ral3000-subtle" : "border-gray-100 hover:bg-stone-50")}>
                          {editingProjectName === p.id ? (
                            <input
                              autoFocus
                              className="flex-1 border rounded px-2 py-1 text-sm focus:outline-none focus:ring-2 focus:ring-ral3000-light"
                              value={p.title}
                              onChange={e => setProjects(projects.map(x => x.id === p.id ? { ...x, title: e.target.value } : x))}
                              onBlur={() => setEditingProjectName(null)}
                              onKeyDown={e => { if (e.key === "Enter") setEditingProjectName(null); }}
                            />
                          ) : (
                            <div className="flex-1 min-w-0">
                              <div className="text-sm font-semibold text-gray-800 truncate">{p.title || "Objektas " + p.id}</div>
                              <div className="text-xs text-gray-400">{p.groups ? p.groups.reduce((a,g) => a + g.tasks.length, 0) : 0} uzduotys</div>
                            </div>
                          )}
                          <button onClick={() => { setActiveProjectId(p.id); setShowProjectManager(false); }} className="text-xs px-2 py-1 rounded bg-ral3000-subtle hover:bg-blue-200 text-ral3000">Atidaryti</button>
                          <button onClick={() => setEditingProjectName(p.id)} className="text-xs px-2 py-1 rounded bg-ral3000-subtle hover:bg-yellow-200 text-ral3000-mid">Pervadinti</button>
                          {projects.length > 1 && (
                            <button onClick={() => {
                              const remaining = projects.filter(x => x.id !== p.id);
                              setProjects(remaining);
                              if (activeProjectId === p.id) setActiveProjectId(remaining[0].id);
                            }} className="text-xs px-2 py-1 rounded bg-ral3000-subtle hover:bg-ral3000-subtle text-ral3000">Istrinti</button>
                          )}
                        </div>
                      ))}
                    </div>
                    <button
                      className="w-full bg-green-100 hover:bg-green-200 text-ral7012-dark rounded-lg py-2 text-sm font-semibold"
                      onClick={() => {
                        const newId = Date.now();
                        setProjects([...projects, { id: newId, title: "Naujas objektas", subtitle: "", groups: [], brigades: [] }]);
                        setActiveProjectId(newId);
                        setShowProjectManager(false);
                      }}
                    >+ Prideti nauja objekta</button>
                  </div>
                </Modal>
              )}
            </div>
          );
        }
        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
