<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMTEKA DV Aplinka</title>

    <!-- ═══════════════════════════════════════════════════════════
         GOOGLE DRIVE SINCHRONIZACIJA
         Pakeiskite GDRIVE_CLIENT_ID savo Google OAuth 2.0 Client ID
    ═══════════════════════════════════════════════════════════ -->
    <script>
    // ── Konfigūracija ──────────────────────────────────────────
    const GDRIVE_CLIENT_ID = "1022186196213-mkjg8v4q48qd3i237ho0g5tbb4aqp2k0.apps.googleusercontent.com
"; // <-- čia įrašykite savo Client ID
    const GDRIVE_SCOPES    = "https://www.googleapis.com/auth/drive.appdata";
    const GDRIVE_FILE_NAME = "amteka_duomenys.json";

    // ── Būsena ─────────────────────────────────────────────────
    window.GDrive = {
      token: null,
      fileId: null,
      ready: false,
      syncing: false,
      lastSyncTime: null,
      pendingSync: false,
      syncTimer: null,

      // Prisijungti
      async signIn() {
        return new Promise((resolve, reject) => {
          const w = window.open(
            `https://accounts.google.com/o/oauth2/v2/auth?client_id=${GDRIVE_CLIENT_ID}&redirect_uri=${encodeURIComponent(location.origin+location.pathname)}&response_type=token&scope=${encodeURIComponent(GDRIVE_SCOPES)}&prompt=select_account`,
            "gdrive_auth", "width=500,height=600,left=200,top=100"
          );
          window._gdriveAuthResolve = resolve;
          window._gdriveAuthReject  = reject;
          const t = setInterval(() => { if(w.closed) { clearInterval(t); reject(new Error("Langas uždarytas")); } }, 1000);
        });
      },

      // Gauti token iš URL hash (OAuth redirect)
      parseTokenFromHash() {
        const h = location.hash;
        if (!h) return null;
        const p = new URLSearchParams(h.replace("#",""));
        const token = p.get("access_token");
        const expires = parseInt(p.get("expires_in") || "3600");
        if (token) {
          history.replaceState(null, "", location.pathname);
          const exp = Date.now() + expires * 1000;
          sessionStorage.setItem("gdrive_token", token);
          sessionStorage.setItem("gdrive_token_exp", exp);
          return token;
        }
        return null;
      },

      getStoredToken() {
        const t = sessionStorage.getItem("gdrive_token");
        const exp = parseInt(sessionStorage.getItem("gdrive_token_exp") || "0");
        if (t && Date.now() < exp - 60000) return t;
        return null;
      },

      async api(method, url, body, isOctet) {
        const headers = { "Authorization": "Bearer " + this.token };
        if (body && !isOctet) headers["Content-Type"] = "application/json";
        const r = await fetch(url, { method, headers, body: body ? (isOctet ? body : JSON.stringify(body)) : undefined });
        if (!r.ok) throw new Error(`API klaida: ${r.status} ${r.statusText}`);
        const ct = r.headers.get("content-type") || "";
        if (ct.includes("application/json")) return r.json();
        return r.text();
      },

      // Rasti arba sukurti duomenų failą
      async findOrCreateFile() {
        const res = await this.api("GET",
          `https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=name='${GDRIVE_FILE_NAME}'&fields=files(id,name,modifiedTime)`);
        if (res.files && res.files.length > 0) {
          this.fileId = res.files[0].id;
          return "found";
        }
        // Sukurti naują
        const meta = await this.api("POST",
          "https://www.googleapis.com/drive/v3/files",
          { name: GDRIVE_FILE_NAME, parents: ["appDataFolder"] });
        this.fileId = meta.id;
        return "created";
      },

      // Įkelti duomenis iš Drive
      async loadFromDrive() {
        if (!this.fileId) return null;
        try {
          const text = await this.api("GET",
            `https://www.googleapis.com/drive/v3/files/${this.fileId}?alt=media`);
          return typeof text === "string" ? JSON.parse(text) : text;
        } catch(e) {
          return null;
        }
      },

      // Išsaugoti duomenis į Drive
      async saveToDrive(data) {
        if (!this.fileId || !this.token) return;
        const body = JSON.stringify(data);
        const blob = new Blob([body], { type: "application/json" });
        await fetch(
          `https://www.googleapis.com/upload/drive/v3/files/${this.fileId}?uploadType=media`,
          { method: "PATCH", headers: { "Authorization": "Bearer " + this.token, "Content-Type": "application/json" }, body: blob }
        );
        this.lastSyncTime = new Date();
        this.updateStatusUI();
      },

      // Surinkti visus lokalius duomenis
      collectLocalData() {
        const ls = {};
        const AMTEKA_KEYS = ["gantt_projects","gantt_groups","gantt_brigades","gantt_active_project",
          "gantt_custom_colors","gantt_auto","ocr_zones","uzsakymai_memory","prasymai_knownPersons"];
        AMTEKA_KEYS.forEach(k => {
          const v = localStorage.getItem(k);
          if (v !== null) ls[k] = v;
        });
        // Taip pat visi kiti gantt_/amteka_ raktai
        for (let i = 0; i < localStorage.length; i++) {
          const k = localStorage.key(i);
          if (!ls[k] && (k.startsWith("gantt_")||k.startsWith("amteka_")||k.startsWith("ocr_")||k.startsWith("uzsakymai_")||k.startsWith("prasymai_"))) {
            ls[k] = localStorage.getItem(k);
          }
        }
        return ls;
      },

      // Taikyti duomenis į localStorage
      applyToLocal(ls) {
        if (!ls) return;
        Object.entries(ls).forEach(([k, v]) => {
          try { localStorage.setItem(k, v); } catch(e) {}
        });
      },

      // Atidėta sinchronizacija (debounce 3s)
      scheduleSave() {
        if (!this.ready || !this.token) return;
        this.pendingSync = true;
        if (this.syncTimer) clearTimeout(this.syncTimer);
        this.syncTimer = setTimeout(() => this.doSync(), 3000);
        this.updateStatusUI("pending");
      },

      async doSync() {
        if (this.syncing || !this.token) return;
        this.syncing = true;
        this.pendingSync = false;
        this.updateStatusUI("syncing");
        try {
          await this.saveToDrive({ localStorage: this.collectLocalData(), savedAt: new Date().toISOString() });
          this.updateStatusUI("ok");
        } catch(e) {
          console.error("Drive sync klaida:", e);
          this.updateStatusUI("error");
        } finally { this.syncing = false; }
      },

      updateStatusUI(state) {
        const el = document.getElementById("gdrive-status");
        if (!el) return;
        const icons = { ok:"☁️", syncing:"🔄", pending:"⏳", error:"⚠️", offline:"🔴", loading:"⏳" };
        const texts = {
          ok: "Drive: " + (this.lastSyncTime ? this.lastSyncTime.toLocaleTimeString("lt-LT") : "sinchronizuota"),
          syncing: "Saugoma Drive...",
          pending: "Laukia sinchronizacijos...",
          error: "Drive klaida",
          offline: "Neprisijungta prie Drive",
          loading: "Jungiamasi prie Drive..."
        };
        const colors = { ok:"#2e7d32", syncing:"#f59e0b", pending:"#596163", error:"#CC2500", offline:"#9e9e9e", loading:"#596163" };
        const s = state || (this.token ? "ok" : "offline");
        el.innerHTML = `<span>${icons[s]||"☁️"} ${texts[s]||s}</span>`;
        el.style.color = colors[s] || "#596163";
      },

      // Pagrindinis init
      async init() {
        const statusEl = document.getElementById("gdrive-status");

        // Patikrinti ar tai OAuth redirect
        const hashToken = this.parseTokenFromHash();
        if (hashToken && window.opener && window._gdriveAuthResolve) {
          window.opener._gdriveAuthResolve(hashToken);
          window.close();
          return;
        }
        if (hashToken && window.opener) { window.close(); return; }

        // Bandyti naudoti išsaugotą tokeną
        const stored = this.getStoredToken();
        if (stored) {
          this.token = stored;
          this.updateStatusUI("loading");
          try {
            await this.findOrCreateFile();
            const remote = await this.loadFromDrive();
            if (remote && remote.localStorage) {
              this.applyToLocal(remote.localStorage);
            }
            this.ready = true;
            this.updateStatusUI("ok");
            this.hookLocalStorage();
            return;
          } catch(e) {
            console.warn("Drive init klaida:", e);
            this.token = null;
          }
        }

        this.updateStatusUI("offline");
      },

      // Perjungia prisijungimą
      async toggleSignIn() {
        if (this.token) {
          // Atsijungti
          sessionStorage.removeItem("gdrive_token");
          sessionStorage.removeItem("gdrive_token_exp");
          this.token = null;
          this.ready = false;
          this.fileId = null;
          this.updateStatusUI("offline");
          document.getElementById("gdrive-btn").textContent = "🔑 Prisijungti prie Drive";
          return;
        }
        // Prisijungti
        document.getElementById("gdrive-btn").textContent = "⏳ Jungiamasi...";
        document.getElementById("gdrive-btn").disabled = true;
        try {
          const token = await this.signIn();
          this.token = token;
          sessionStorage.setItem("gdrive_token", token);
          sessionStorage.setItem("gdrive_token_exp", Date.now() + 3600000);
          this.updateStatusUI("loading");
          await this.findOrCreateFile();
          const remote = await this.loadFromDrive();
          if (remote && remote.localStorage) {
            const hasLocal = localStorage.getItem("gantt_projects");
            if (hasLocal && remote.localStorage.gantt_projects) {
              const choice = confirm(
                "Drive ir šiame kompiuteryje yra duomenys.\n\n" +
                "Spausti OK – naudoti Drive duomenis (rekomenduojama)\n" +
                "Spausti Atšaukti – palikti šio kompiuterio duomenis"
              );
              if (choice) this.applyToLocal(remote.localStorage);
            } else {
              this.applyToLocal(remote.localStorage);
            }
          }
          this.ready = true;
          this.hookLocalStorage();
          this.updateStatusUI("ok");
          document.getElementById("gdrive-btn").textContent = "☁️ Atsijungti nuo Drive";
          document.getElementById("gdrive-btn").disabled = false;
          // Perkrauti programą kad duomenys įsikrautų
          if (remote && remote.localStorage) {
            setTimeout(() => location.reload(), 800);
          }
        } catch(e) {
          console.error("Prisijungimo klaida:", e);
          document.getElementById("gdrive-btn").textContent = "🔑 Prisijungti prie Drive";
          document.getElementById("gdrive-btn").disabled = false;
          alert("Nepavyko prisijungti prie Google Drive:\n" + e.message);
        }
      },

      // Perimti localStorage.setItem
      hookLocalStorage() {
        const orig = Storage.prototype.setItem;
        const self = this;
        Storage.prototype.setItem = function(key, value) {
          orig.call(this, key, value);
          if (this === localStorage && (
            key.startsWith("gantt_") || key.startsWith("amteka_") ||
            key.startsWith("ocr_") || key.startsWith("uzsakymai_") ||
            key.startsWith("prasymai_")
          )) {
            self.scheduleSave();
          }
        };
      }
    };

    // Inicijuoti kai DOM paruoštas
    document.addEventListener("DOMContentLoaded", () => {
      GDrive.init();
    });
    </script>

    <!-- Google Drive UI juosta (įterpiama į <body> per DOMContentLoaded) -->
    <style>
      #gdrive-bar {
        position: fixed;
        bottom: 0; left: 0; right: 0;
        background: #fff;
        border-top: 2px solid #CC2500;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 7px 18px;
        z-index: 9999;
        box-shadow: 0 -2px 8px rgba(0,0,0,0.08);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-size: 13px;
      }
      #gdrive-bar .gdrive-logo { font-size: 18px; }
      #gdrive-status { color: #596163; font-weight: 600; flex: 1; }
      #gdrive-btn {
        padding: 5px 14px;
        border-radius: 8px;
        background: #CC2500;
        color: #fff;
        font-weight: 600;
        font-size: 12px;
        border: none;
        cursor: pointer;
        transition: background 0.15s;
      }
      #gdrive-btn:hover:not(:disabled) { background: #A01D00; }
      #gdrive-btn:disabled { opacity: 0.6; cursor: not-allowed; }
      #gdrive-sync-now {
        padding: 5px 12px;
        border-radius: 8px;
        background: #EEF0F0;
        color: #596163;
        font-weight: 600;
        font-size: 12px;
        border: none;
        cursor: pointer;
      }
      #gdrive-sync-now:hover { background: #D8DADB; }
      /* Kad turinys nesuliptų po juosta */
      body { padding-bottom: 48px !important; }
    </style>
    <script>
    document.addEventListener("DOMContentLoaded", () => {
      const bar = document.createElement("div");
      bar.id = "gdrive-bar";
      bar.innerHTML = `
        <span class="gdrive-logo">☁️</span>
        <span id="gdrive-status">Kraunama...</span>
        <button id="gdrive-sync-now" onclick="GDrive.doSync()" title="Sinchronizuoti dabar">🔄 Sinchronizuoti</button>
        <button id="gdrive-btn" onclick="GDrive.toggleSignIn()">🔑 Prisijungti prie Drive</button>
      `;
      document.body.appendChild(bar);

      // Atnaujinti mygtuko tekstą jei jau prisijungta
      const stored = GDrive.getStoredToken ? GDrive.getStoredToken() : null;
      if (stored) {
        document.getElementById("gdrive-btn").textContent = "☁️ Atsijungti nuo Drive";
      }
    });
    </script>

    <style>
        /* ═══════════════════════════════════════════════
           AMTEKA spalvų tema — RAL3000 + RAL7012
           RAL3000 = #CC2500  (ugniagesių raudona)
           RAL7012 = #596163  (bazalto pilka)
           BG      = #F4F4F2  (šiltas baltas fonas)
        ═══════════════════════════════════════════════ */
        :root {
          --ral3000:        #CC2500;
          --ral3000-dark:   #A01D00;
          --ral3000-mid:    #E05020;
          --ral3000-light:  #F0A090;
          --ral3000-subtle: #FAE8E4;
          --ral7012:        #596163;
          --ral7012-dark:   #3E4547;
          --ral7012-light:  #8A9496;
          --ral7012-subtle: #EEF0F0;
          --bg:             #F4F4F2;
          --bg-card:        #FFFFFF;
          --border:         #DDD;
          --text-main:      #1C1C1C;
          --text-sub:       #596163;
          --text-muted:     #8A9496;

        body { background-color: var(--bg); color: var(--text-main); }

        /* Tailwind stone override */

        /* RAL3000 klasės */

        .bg-ral3000-dark   { background-color: var(--ral3000-dark) !important; }
        .bg-ral3000-subtle { background-color: var(--ral3000-subtle) !important; }
        .hover\:bg-ral3000-dark:hover   { background-color: var(--ral3000-dark) !important; }
        .hover\:bg-ral3000-subtle:hover { background-color: var(--ral3000-subtle) !important; }
        .text-ral3000       { color: var(--ral3000) !important; }
        .text-ral3000-mid   { color: var(--ral3000-mid) !important; }
        .text-ral3000-light { color: var(--ral3000-light) !important; }
        .hover\:text-ral3000:hover { color: var(--ral3000) !important; }
        .border-ral3000       { border-color: var(--ral3000) !important; }
        .border-ral3000-light { border-color: var(--ral3000-light) !important; }
        .hover\:border-ral3000:hover { border-color: var(--ral3000) !important; }
        .focus\:ring-ral3000-light:focus { --tw-ring-color: var(--ral3000-light) !important; box-shadow: 0 0 0 3px var(--ral3000-light) !important; }
        .focus\:border-ral3000:focus { border-color: var(--ral3000) !important; }

        /* RAL7012 klasės */

        .border-ral7012        { border-color: var(--ral7012) !important; }
        .border-ral7012-subtle { border-color: var(--ral7012-subtle) !important; }
        .border-ral7012-light  { border-color: var(--ral7012-light) !important; }
        .hover\:border-ral7012:hover { border-color: var(--ral7012) !important; }
        .focus\:ring-ral7012-light:focus { --tw-ring-color: var(--ral7012-light) !important; box-shadow: 0 0 0 3px var(--ral7012-light) !important; }

        /* Fonas */
        .bg-white { background-color: var(--bg-card) !important; }

<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useMemo, useRef, useEffect } = React;
        const DEFAULT_COLORS = [
          { label: "Violetinė", value: "#9b87d4" },
          { label: "Mėlyna", value: "#4a90d9" },
          { label: "Žalia", value: "#5cb85c" },
          { label: "Oranžinė", value: "#f0ad4e" },
          { label: "Raudona", value: "#d9534f" },
          { label: "Žydra", value: "#5bc0de" },

        function getEaster(year) {

          const d = Math.floor(b/4), e = b % 4, f = Math.floor((b+8)/25);
          const g = Math.floor((b-f+1)/3), h = (19*a+b-d-g+15) % 30;
          const i = Math.floor(c/4), k = c % 4;

        function splitVacationAroundHolidays(fromStr, toStr) {

        function AutoView({ autoData, setAutoData }) {
          const [tab, setTab] = React.useState("trips");
          const [autoMonth, setAutoMonth] = React.useState(() => { const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"); });

          // Car form state
          const [showCarForm, setShowCarForm] = React.useState(false);
          const [editCar, setEditCar] = React.useState({...autoData.car});

          // Trip form state
          const [showTripForm, setShowTripForm] = React.useState(false);
          const [tripForm, setTripForm] = React.useState(null);

          // Receipt form state
          const [showReceiptForm, setShowReceiptForm] = React.useState(false);
          const [receiptForm, setReceiptForm] = React.useState(null);

          // Dažniausias vairuotojas iš kelionių istorijos
          const mostFrequentDriver = React.useMemo(() => {
            const trips = autoData.trips || [];
            if (trips.length === 0) return "";
            const freq = {};
            trips.forEach(t => { if (t.driver) freq[t.driver] = (freq[t.driver]||0) + 1; });
            let best = ""; let max = 0;
            Object.entries(freq).forEach(([d,c]) => { if (c > max) { max = c; best = d; } });
            return best;
          }, [autoData.trips]);

          // Unikalūs maršrutai iš kelionių istorijos (pagal dažnumą)
          const uniqueRoutes = React.useMemo(() => {
            const trips = autoData.trips || [];

          async function runOCR(imageDataUrl, zone) {
            setOcrStatus("loading");
            try {
              const worker = await Tesseract.createWorker("lit+eng", 1, {
                logger: () => {}
              });
              const opts = {};
              if (zone) {
                opts.rectangle = zone;
              }
              const { data: { text } } = await worker.recognize(imageDataUrl, opts);
              await worker.terminate();
              setOcrStatus("done");
              return text.trim();
            } catch(e) {
              setOcrStatus("error");
              console.error("OCR klaida:", e);
              return "";
            }
          }

          async function runFullOCR(imageDataUrl) {
            setOcrStatus("loading");
            setOcrRawText("");
            try {
              const worker = await Tesseract.createWorker("lit+eng", 1, { logger: () => {} });
              const { data: { text } } = await worker.recognize(imageDataUrl);
              await worker.terminate();
              setOcrRawText(text);
              setOcrStatus("done");
              return text;
            } catch(e) {
              setOcrStatus("error");
              return "";
            }
          }

          function parseOcrText(text, currentForm) {
            const updated = {...currentForm};
            const lines = text.split("\n").map(l=>l.trim()).filter(Boolean);

            // Date
            const dateM = text.match(/(\d{4}[-./]\d{2}[-./]\d{2}|\d{2}[-./]\d{2}[-./]\d{4})/);
            if (dateM) {
              let d = dateM[1].replace(/\./g,"-").replace(/\//g,"-");
              if (d.match(/^\d{2}-\d{2}-\d{4}$/)) d = d.split("-").reverse().join("-");
              updated.date = d;
            }

            // Series + number: e.g. "PVM sąskaita faktūra Nr. ABC 001234"
            const numM = text.match(/[Nn]r\.?\s*([A-Z]{1,5})\s*(\d{4,8})/);
            if (numM) { updated.series = numM[1]; updated.number = numM[2]; }

            // Amount incl VAT
            const amtM = [...text.matchAll(/(\d{1,6}[.,]\d{2})\s*€?/g)].map(m=>parseFloat(m[1].replace(",",".")));
            if (amtM.length >= 3) {
              const sorted = [...amtM].sort((a,b)=>b-a);
              updated.amountIncVat = sorted[0].toFixed(2);
              updated.amountExVat = sorted[1].toFixed(2);
              updated.vat = (sorted[0]-sorted[1]).toFixed(2);
            } else if (amtM.length === 1) {
              updated.amountIncVat = amtM[0].toFixed(2);
            }

            // Liters
            const litM = text.match(/(\d{1,4}[.,]\d{1,4})\s*[Ll]/);
            if (litM) updated.liters = parseFloat(litM[1].replace(",",".")).toFixed(2);

            // Price per liter
            const pplM = text.match(/(\d{1,2}[.,]\d{3,4})\s*€?\s*\/?\s*[Ll]/);
            if (pplM) updated.pricePerLiter = parseFloat(pplM[1].replace(",",".")).toFixed(4);

            // VAT code
            const vatM = text.match(/LT\d{9,12}/);
            if (vatM) updated.supplierVat = vatM[0];

            // Company code
            const codeM = text.match(/\b(\d{7,9})\b/);
            if (codeM && !updated.supplierCode) updated.supplierCode = codeM[1];

            return updated;
          }

        // ══════════════════════════════════════════════════════════
        // SANDĖLIS — Medžiagų sandėlio apskaita
        // ══════════════════════════════════════════════════════════
        function SandelisView({ ziniarastis, projects, activeProjectId }) {
          const [selectedItemKey, setSelectedItemKey] = React.useState(null);

          const activeProject = projects.find(p => p.id === activeProjectId);
          const orders = activeProject ? (activeProject.uzsakymai || []) : [];
          const atliktiDarbai = activeProject ? (activeProject.atliktiDarbai || []) : [];

          // Surinkti visus pristatymus iš užsakymų
          // Struktūra: { itemKey -> { delivered: number, deliveryHistory: [...], usageHistory: [...] } }
          // itemKey = zinGroupId + "|" + zinItemId arba rowId jei nėra susiejimo

          // Sukurti žiniaraščio elementų žemėlapį
          const zinItems = []; // { id, groupId, groupName, name, unit }
          (ziniarastis || []).forEach(g => {
            (g.items || []).forEach(it => {
              zinItems.push({ id: String(it.id), groupId: String(g.id), groupName: g.groupName, name: it.name, unit: it.unit });
            });
          });

          // Susieti užsakymų eilutes su žiniaraščiu
          // Kiekvienam žiniaraščio elementui sukaupti pristatytus kiekius
          const stockMap = {}; // zinItemId -> { groupName, name, unit, ordered, delivered, used, deliveries:[], usages:[] }

          zinItems.forEach(it => {
            stockMap[it.id] = {
              groupId: it.groupId, groupName: it.groupName,
              name: it.name, unit: it.unit,
              ordered: 0, delivered: 0, used: 0,
              deliveries: [], usages: []
            };
          });

          // Pridėti pristatytus kiekius iš užsakymų
          orders.forEach(order => {
            (order.rows || []).forEach(row => {
              const zinIid = row.zinItemId ? String(row.zinItemId) : null;
              if (!zinIid || !stockMap[zinIid]) return;
              stockMap[zinIid].ordered += parseFloat(row.qty) || 0;
              // Pristatymai
              (order.deliveries || []).forEach(del => {
                const di = (del.items || []).find(it => it.rowId === row.id);
                if (!di) return;
                const qty = parseFloat(di.qty) || 0;
                if (qty <= 0) return;
                stockMap[zinIid].delivered += qty;
                stockMap[zinIid].deliveries.push({
                  date: del.date || "—",
                  orderTitle: order.title || "Užsakymas",
                  supplier: order.supplier || "—",
                  qty,
                  note: del.note || ""
                });
              });
            });
          });

          // Atimti atliktų darbų kiekius
          atliktiDarbai.forEach(entry => {
            (entry.items || []).forEach(it => {
              const qty = parseFloat(it.qty) || 0;
              if (qty <= 0) return;
              const iid = it.itemId ? String(it.itemId) : null;
              if (!iid || !stockMap[iid]) return;
              stockMap[iid].used += qty;
              stockMap[iid].usages.push({
                date: entry.date || "—",
                qty,
                note: entry.notes || ""
              });
            });
          });

          // Sugrupuoti pagal žiniaraščio grupes
          const groupedStock = {};
          zinItems.forEach(it => {
            const s = stockMap[it.id];
            if (!groupedStock[s.groupId]) groupedStock[s.groupId] = { groupName: s.groupName, items: [] };
            groupedStock[s.groupId].items.push({ ...s, itemId: it.id });
          });

          const selectedItem = selectedItemKey ? stockMap[selectedItemKey] : null;

          // Surūšiuoti pristatymus ir sąnaudas pagal datą
          const sortedDeliveries = selectedItem ? [...selectedItem.deliveries].sort((a,b) => b.date.localeCompare(a.date)) : [];
          const sortedUsages = selectedItem ? [...selectedItem.usages].sort((a,b) => b.date.localeCompare(a.date)) : [];

          const hasSomeData = Object.values(stockMap).some(s => s.delivered > 0 || s.used > 0);

          return (
            <div className="bg-white rounded-xl shadow p-4">
              <div className="flex items-center justify-between mb-4">
                <div>
                  <h2 className="text-xl font-bold text-gray-800">🏪 Sandėlis</h2>
                  <p className="text-xs text-gray-400 mt-0.5">Pristatytos medžiagos iš užsakymų · Likučiai po atliktų darbų</p>
                </div>
                {!hasSomeData && (
                  <div className="text-xs text-gray-400 bg-stone-50 border border-gray-200 rounded-lg px-3 py-2">
                    Dar nėra pristatymų. Įrašykite pristatymus Užsakymų skirtuke.
                  </div>
                )}
              </div>

              <div className="flex gap-4">
                {/* Kairė — sandėlio lentelė */}
                <div className="flex-1 min-w-0 overflow-x-auto">
                  {Object.values(groupedStock).map(group => {
                    const groupItems = group.items.filter(it => it.delivered > 0 || it.used > 0 || it.ordered > 0);
                    if (groupItems.length === 0) return null;
                    return (
                      <div key={group.groupName} className="mb-4">
                        <div className="bg-stone-100 rounded-t-lg px-3 py-1.5 font-bold text-xs text-gray-600 uppercase tracking-wide border-b border-gray-200">
                          {group.groupName}
                        </div>
                        <table className="w-full text-sm border-collapse">
                          <thead>
                            <tr className="bg-stone-50 border-b border-gray-200 text-xs text-gray-500 font-semibold">
                              <th className="text-left px-3 py-2">Pozicija</th>
                              <th className="text-center px-2 py-2 w-16">Vnt.</th>
                              <th className="text-center px-2 py-2 w-28">Pristatyta</th>
                              <th className="text-center px-2 py-2 w-28">Panaudota</th>
                              <th className="text-center px-2 py-2 w-28 font-bold">Turimas kiekis</th>
                            </tr>
                          </thead>
                          <tbody>
                            {groupItems.map(it => {
                              const avail = it.delivered - it.used;
                              const isSelected = selectedItemKey === it.itemId;
                              const isLow = avail < 0;
                              const isZero = avail === 0 && it.delivered > 0;
                              return (
                                <tr
                                  key={it.itemId}
                                  onClick={() => setSelectedItemKey(isSelected ? null : it.itemId)}
                                  className={"border-b border-gray-100 cursor-pointer transition-colors " + (isSelected ? "bg-teal-50 border-l-4 border-l-teal-400" : "hover:bg-stone-50")}
                                >
                                  <td className="px-3 py-2 font-medium text-gray-800 text-sm">{it.name}</td>
                                  <td className="px-2 py-2 text-center text-xs text-gray-500">{it.unit}</td>
                                  <td className="px-2 py-2 text-center">
                                    <span className="text-ral3000 font-semibold">{it.delivered > 0 ? it.delivered.toFixed(2) : "—"}</span>
                                  </td>
                                  <td className="px-2 py-2 text-center">
                                    <span className="text-orange-600 font-semibold">{it.used > 0 ? it.used.toFixed(2) : "—"}</span>
                                  </td>
                                  <td className="px-2 py-2 text-center">
                                    <span className={"font-bold text-base px-2 py-0.5 rounded-full " + (isLow ? "bg-ral3000-subtle text-ral3000" : isZero ? "bg-stone-100 text-gray-500" : "bg-green-100 text-ral7012-dark")}>
                                      {avail.toFixed(2)}
                                    </span>
                                  </td>
                                </tr>
                              );
                            })}
                          </tbody>
                        </table>
                      </div>
                    );
                  })}
                  {!hasSomeData && (
                    <div className="text-center text-gray-400 py-16 text-sm">
                      <div className="text-4xl mb-3">🏪</div>
                      <div className="font-semibold mb-1">Sandėlis tuščias</div>

                {selectedItem && (

                    {/* Pristatymų istorija */}

                      {sortedDeliveries.length === 0 ? (

                    {/* Sąnaudų istorija */}
                    <div>
                      <div className="text-xs font-bold text-orange-700 mb-1.5 flex items-center gap-1">

                      </div>
                      {sortedUsages.length === 0 ? (
                        <div className="text-xs text-gray-400 italic py-2 text-center">Nėra sąnaudų įrašų</div>
                      ) : (
                        <div className="space-y-1.5 max-h-52 overflow-y-auto pr-1">
                          {sortedUsages.map((u, i) => (

                              <div className="flex items-center justify-between mb-0.5">

        }
        // ══ pabaiga: SandelisView ═════════════════════════════════

        // ══════════════════════════════════════════════════════════
        // COMBO INPUT — apibrėžtas išorėje, kad nerenderintų iš naujo
        // ══════════════════════════════════════════════════════════
        function ComboInput({ value, onChange, options, placeholder, inputClassName }) {
          const [open, setOpen] = React.useState(false);
          const wrapRef = React.useRef(null);
          const inputRef = React.useRef(null);

          // Uždaryti kai spaudžiama kitur
          React.useEffect(() => {
            function onDown(e) {
              if (wrapRef.current && !wrapRef.current.contains(e.target)) setOpen(false);
            }
            document.addEventListener("mousedown", onDown);
            return () => document.removeEventListener("mousedown", onDown);
          }, []);

          const filtered = React.useMemo(() => {
            if (!options || options.length === 0) return [];
            const q = (value || "").toLowerCase();
            return options.filter(o => o !== value && o.toLowerCase().includes(q)).slice(0, 12);
          }, [options, value]);

          return (
            <div ref={wrapRef} style={{ position: "relative" }}>
              <input
                ref={inputRef}
                className={"w-full border rounded px-2 py-1 text-xs " + (inputClassName||"")}
                value={value || ""}
                placeholder={placeholder || ""}
                autoComplete="off"
                onChange={e => { onChange(e.target.value); setOpen(true); }}
                onFocus={() => setOpen(true)}
              />
              {open && filtered.length > 0 && (
                <div style={{
                  position:"absolute", top:"100%", left:0, right:0, zIndex:9999,
                  background:"white", border:"1px solid #d1d5db", borderRadius:6,
                  boxShadow:"0 6px 16px rgba(0,0,0,0.18)", maxHeight:160, overflowY:"auto"
                }}>
                  {filtered.map((opt, i) => (
                    <div
                      key={i}
                      style={{ padding:"6px 10px", fontSize:12, cursor:"pointer", borderBottom:"1px solid #f3f4f6" }}
                      className="hover:bg-orange-50 text-gray-800"
                      onMouseDown={e => {
                        e.preventDefault(); // neleidžia prarasti focus nuo input
                        onChange(opt);
                        setOpen(false);
                      }}
                    >
                      {opt}
                    </div>
                  ))}
                </div>
              )}
            </div>
          );
        }

        // ══════════════════════════════════════════════════════════
        // UŽSAKYMŲ VALDYMAS — Modulis (v3)
        // ══════════════════════════════════════════════════════════
        function UzsakymaiView({ ziniarastis, projectTitle, projects, activeProjectId, setProjects }) {
          const today = new Date();
          const todayStr = today.getFullYear()+"-"+String(today.getMonth()+1).padStart(2,"0")+"-"+String(today.getDate()).padStart(2,"0");

          const getOrders = () => { const p = projects.find(x=>x.id===activeProjectId); return p ? (p.uzsakymai||[]) : []; };
          const saveOrders = (orders) => { setProjects(projects.map(p=>p.id===activeProjectId?{...p,uzsakymai:orders}:p)); };
          const orders = getOrders();

          // ── Atmintis ──
          function getMemory() { try { return JSON.parse(localStorage.getItem("uzsakymai_memory")||"{}"); } catch(e) { return {}; } }
          function saveMemory(mem) { try { localStorage.setItem("uzsakymai_memory", JSON.stringify(mem)); } catch(e) {} }
          // isEdit=true: perrašo esamus produktų įrašus; false: tik papildo naujus
          function learnFromOrder(orderData, isEdit) {
            const mem = getMemory();
            if(!mem.suppliers) mem.suppliers = [];
            if(!mem.addresses) mem.addresses = [];
            if(!mem.products)  mem.products  = {};
            const sup = (orderData.supplier||"").trim();
            if(sup && !mem.suppliers.includes(sup)) mem.suppliers.push(sup);
            const addr = (orderData.address||"").trim();
            if(addr && !mem.addresses.includes(addr)) mem.addresses.push(addr);
            (orderData.rows||[]).forEach(r => {
              const name = (r.name||"").trim(); if(!name) return;
              const rowSup = (r.supplier||orderData.supplier||"").trim();
              // Visada saugome ID kaip string kad išvengtume tipo neatitikimų
              const zinGid = r.zinGroupId ? String(r.zinGroupId) : "";
              const zinIid = r.zinItemId  ? String(r.zinItemId)  : "";
              if(isEdit) {
                const prev = mem.products[name]||{};
                const sups = prev.suppliers||[];
                if(rowSup && !sups.includes(rowSup)) sups.push(rowSup);
                mem.products[name] = {
                  unit:         r.unit        || prev.unit,
                  supplier:     rowSup        || prev.supplier,
                  suppliers:    sups,
                  zinGroupId:   zinGid        || prev.zinGroupId  || "",
                  zinGroupName: r.zinGroupName|| prev.zinGroupName|| "",
                  zinItemId:    zinIid        || prev.zinItemId   || "",
                  zinItemName:  r.zinItemName || prev.zinItemName || "",
                };
              } else {
                if(!mem.products[name]) mem.products[name] = {};
                const prod = mem.products[name];
                if(r.unit) prod.unit = r.unit;
                if(rowSup) {
                  if(!prod.suppliers) prod.suppliers = [];
                  if(!prod.suppliers.includes(rowSup)) prod.suppliers.push(rowSup);
                  prod.supplier = rowSup;
                }
                if(zinGid) { prod.zinGroupId = zinGid; prod.zinGroupName = r.zinGroupName||""; }
                if(zinIid) { prod.zinItemId  = zinIid; prod.zinItemName  = r.zinItemName ||""; }
              }
            });
            saveMemory(mem);
          }

          const mem = getMemory();
          const memSuppliers    = mem.suppliers || [];
          const memAddresses    = mem.addresses || [];
          const memProducts     = mem.products  || {};
          const memProductNames = Object.keys(memProducts);

          // ── State ──
          const [activeOrderId, setActiveOrderId]   = React.useState(null);
          const [modalMode, setModalMode]            = React.useState(null); // null | "new" | "edit"
          const [editOrderId, setEditOrderId]        = React.useState(null);
          const [formTitle, setFormTitle]            = React.useState("");
          const [formSupplier, setFormSupplier]      = React.useState("");
          const [formAddress, setFormAddress]        = React.useState("");
          const [formDate, setFormDate]              = React.useState(todayStr);
          const [orderRows, setOrderRows]            = React.useState([emptyRow()]);
          const [showDelivery, setShowDelivery]      = React.useState(null);
          const [deliveryForm, setDeliveryForm]      = React.useState({ date:todayStr, note:"", items:[], attachments:[] });
          const [previewFile, setPreviewFile]        = React.useState(null);
          const [exportingPdf, setExportingPdf]      = React.useState(false);

          // ── Paieška, filtravimas, rūšiavimas ──
          const [searchText, setSearchText]          = React.useState("");
          const [sortDir, setSortDir]                = React.useState("none"); // "none" | "asc" | "desc"
          const [dateFilter, setDateFilter]          = React.useState("all"); // "all" | "day" | "week" | "month"
          const [filterDate, setFilterDate]          = React.useState(todayStr);

          // Filtruoti ir rūšiuoti užsakymų sąrašą
          function getFilteredOrders() {
            let result = [...orders];

            // 1. Paieška pagal pavadinimą
            if (searchText.trim()) {
              const q = searchText.trim().toLowerCase();
              result = result.filter(o => (o.title||"").toLowerCase().includes(q));
            }

            // 2. Datos filtras
            if (dateFilter !== "all") {
              const d = new Date(filterDate);
              result = result.filter(o => {
                if (!o.date) return false;
                const od = new Date(o.date);
                if (dateFilter === "day") {
                  return o.date === filterDate;
                } else if (dateFilter === "week") {
                  const day = d.getDay(); const diff = day === 0 ? -6 : 1 - day;
                  const mon = new Date(d); mon.setDate(d.getDate() + diff);
                  const sun = new Date(mon); sun.setDate(mon.getDate() + 6);
                  return od >= mon && od <= sun;
                } else if (dateFilter === "month") {
                  return od.getFullYear() === d.getFullYear() && od.getMonth() === d.getMonth();
                }
                return true;
              });
            }

            // 3. Rūšiavimas pagal pavadinimą
            if (sortDir === "asc") {
              result.sort((a,b) => (a.title||"").localeCompare(b.title||"", "lt"));
            } else if (sortDir === "desc") {
              result.sort((a,b) => (b.title||"").localeCompare(a.title||"", "lt"));
            }

            return result;
          }

          const filteredOrders = getFilteredOrders();

          function emptyRow() { return { id: Date.now()+Math.random(), name:"", supplier:"", unit:"vnt.", qty:"", address:"", zinGroupId:"", zinItemId:"" }; }

          // Žiniaraštis
          const allZinGroups = ziniarastis || [];
          const allZinItems = [];
          allZinGroups.forEach(g=>(g.items||[]).forEach(it=>allZinItems.push({...it, groupName:g.groupName, groupId:g.id})));

          // ── Atidaryti modalą naujam užsakymui ──
          function openNew() {
            setFormTitle(""); setFormSupplier(""); setFormAddress(""); setFormDate(todayStr);
            setOrderRows([emptyRow()]);
            setEditOrderId(null);
            setModalMode("new");
          }

          // ── Atidaryti modalą redaguoti ──
          function openEdit(order) {
            setFormTitle(order.title||"");
            setFormSupplier(order.supplier||"");
            setFormAddress(order.address||"");
            setFormDate(order.date||todayStr);
            setOrderRows((order.rows||[]).map(r=>({
              ...r,
              id: r.id||Date.now()+Math.random(),
              zinGroupId: r.zinGroupId ? String(r.zinGroupId) : "",
              zinItemId:  r.zinItemId  ? String(r.zinItemId)  : "",
            })));
            setEditOrderId(order.id);
            setModalMode("edit");
          }

          function closeModal() { setModalMode(null); setEditOrderId(null); }

          // ── Row helpers ──
          function addOrderRow() { setOrderRows(prev => [...prev, emptyRow()]); }
          function removeOrderRow(id) { setOrderRows(prev => prev.filter(r=>r.id!==id)); }
          function updateOrderRow(id, field, val) {
            setOrderRows(prev => prev.map(r => {
              if(r.id !== id) return r;
              const upd = {...r, [field]: val};
              if(field === "zinGroupId") {
                // Grupę pakeitė rankiniu būdu — išvalome eilutę
                upd.zinItemId = "";
              }
              if(field === "zinItemId") {
                // Užtikriname string tipą
                const sid = String(val);
                upd.zinItemId = sid;
                const item = allZinItems.find(it=>String(it.id)===sid);
                if(item) { upd.unit = item.unit; upd.zinItemName = item.name; }
              }
              if(field === "name") {
                const prod = memProducts[val];
                if(prod) {
                  if(prod.unit) upd.unit = prod.unit;
                  if(prod.supplier && !upd.supplier) upd.supplier = prod.supplier;
                  // Atkuriame ir grupę IR eilutę iš atminties
                  if(prod.zinGroupId) {
                    upd.zinGroupId  = String(prod.zinGroupId);
                    upd.zinGroupName= prod.zinGroupName||"";
                    // Atkuriame eilutę tik jei ji priklauso tai pačiai grupei
                    if(prod.zinItemId) {
                      const sid = String(prod.zinItemId);
                      const item = allZinItems.find(it=>String(it.id)===sid && String(it.groupId)===String(prod.zinGroupId));
                      if(item) {
                        upd.zinItemId   = sid;
                        upd.zinItemName = item.name;
                      } else {
                        upd.zinItemId   = sid; // palieka ID net jei item nerastas (gali būti kito projekto)
                        upd.zinItemName = prod.zinItemName||"";
                      }
                    } else {
                      upd.zinItemId = "";
                    }
                  }
                }
              }
              return upd;
            }));
          }

          // ── Išsaugoti (naujas arba redagavimas) ──
          function saveOrder() {
            if(!orderRows.some(r=>(r.name||"").trim())) return;
            const rows = orderRows.filter(r=>(r.name||"").trim()).map((r,i)=>{
              const zinGid = r.zinGroupId ? String(r.zinGroupId) : "";
              const zinIid = r.zinItemId  ? String(r.zinItemId)  : "";
              const zinG = allZinGroups.find(g=>String(g.id)===zinGid);
              const zinI = allZinItems.find(it=>String(it.id)===zinIid);
              return { ...r,
                nr: i+1,
                qty: parseFloat(r.qty)||0,
                zinGroupId:   zinGid,
                zinItemId:    zinIid,
                zinGroupName: zinG ? zinG.groupName  : (r.zinGroupName||""),
                zinItemName:  zinI ? zinI.name       : (r.zinItemName ||""),
              };
            });

            if(modalMode === "new") {
              // Generuoti užsakymo numerį: AM + data + . + eilė šiandien (01, 02, ...)
              const dateCompact = todayStr.replace(/-/g, "");
              const todayOrders = orders.filter(o => (o.title||"").startsWith("AM"+dateCompact+"."));
              const seq = String(todayOrders.length + 1).padStart(2, "0");
              const autoTitle = "AM" + dateCompact + "." + seq;
              const newOrder = {
                id: Date.now(), title: formTitle || autoTitle,
                supplier: formSupplier, address: formAddress, date: formDate,
                orderedBy: "Tomas Slepčenko", status: "aktyvus", rows, deliveries: []
              };
              learnFromOrder(newOrder, false);
              saveOrders([...orders, newOrder]);
              setActiveOrderId(newOrder.id);
            } else {
              const updatedOrders = orders.map(o => {
                if(o.id !== editOrderId) return o;
                const prog = calcOrderProgress({...o, rows});
                return { ...o, title:formTitle||o.title, supplier:formSupplier, address:formAddress,
                  date:formDate, rows, status:prog>=100?"ivykdytas":"aktyvus" };
              });
              learnFromOrder({ supplier:formSupplier, address:formAddress, rows }, true);
              saveOrders(updatedOrders);
            }
            closeModal();
          }

          function deleteOrder(id) {
            if(!window.confirm("Ištrinti užsakymą?")) return;
            saveOrders(orders.filter(o=>o.id!==id));
            if(activeOrderId===id) setActiveOrderId(null);
          }

          function calcOrderProgress(order) {
            const rows = order.rows||[]; if(!rows.length) return 0;
            const totalNeeded = rows.reduce((a,r)=>a+(r.qty||0),0); if(!totalNeeded) return 0;
            const totalDelivered = rows.reduce((a,r)=>{
              const del = (order.deliveries||[]).reduce((s,d)=>{
                const di=(d.items||[]).find(it=>it.rowId===r.id);
                return s+(di?parseFloat(di.qty)||0:0);
              },0);
              return a+Math.min(del,r.qty||0);
            },0);
            return Math.round((totalDelivered/totalNeeded)*100);
          }

          function getRowDelivered(order, rowId) {
            return (order.deliveries||[]).reduce((s,d)=>{
              const di=(d.items||[]).find(it=>it.rowId===rowId);
              return s+(di?parseFloat(di.qty)||0:0);
            },0);
          }

          function openNewDelivery(orderId) {
            const order = orders.find(o=>o.id===orderId); if(!order) return;
            setDeliveryForm({ id:null, date:todayStr, note:"", attachments:[],
              items:(order.rows||[]).map(r=>({rowId:r.id,rowName:r.name,unit:r.unit,qty:""})) });
            setShowDelivery({orderId, deliveryId:null});
          }

          function saveDelivery() {
            const {orderId,deliveryId} = showDelivery;
            const delivery = {...deliveryForm, id:deliveryId||Date.now()};
            const updated = orders.map(o=>{
              if(o.id!==orderId) return o;
              const deliveries = deliveryId
                ? (o.deliveries||[]).map(d=>d.id===deliveryId?delivery:d)
                : [...(o.deliveries||[]),delivery];
              const prog = calcOrderProgress({...o,deliveries});
              return {...o, deliveries, status:prog>=100?"ivykdytas":"aktyvus"};
            });
            saveOrders(updated);
            setShowDelivery(null);
            setDeliveryForm({date:todayStr,note:"",items:[],attachments:[]});
          }

          function handleAttachmentUpload(files) {
            Array.from(files).forEach(file=>{
              const reader = new FileReader();
              reader.onload = e => setDeliveryForm(f=>({...f,attachments:[...(f.attachments||[]),{name:file.name,type:file.type,data:e.target.result}]}));
              reader.readAsDataURL(file);
            });
          }

          function exportOrderExcel(order) {
            if(!window.XLSX) return;
            const XL=window.XLSX; const wb=XL.utils.book_new();
            const rows=[
              ["UŽSAKYMAS: "+order.title],["Tiekėjas:",order.supplier||"—"],
              ["Pristatymo adresas:",order.address||"—"],["Užsakymo data:",order.date],["Užsakė:",order.orderedBy],[],
              ["Eil.Nr.","Prekės pavadinimas","Tiekėjas","Mato vnt.","Kiekis","Pristatymo adresas","Žiniaraštis (grupė / pozicija)"]
            ];
            (order.rows||[]).forEach(r=>{
              const zinG=allZinGroups.find(g=>g.id==r.zinGroupId);
              const zinI=allZinItems.find(it=>it.id==r.zinItemId);
              const zinLabel=zinG?(zinG.groupName+(zinI?" / "+zinI.name:"")):(r.zinGroupName?(r.zinGroupName+(r.zinItemName?" / "+r.zinItemName:"")):"—");
              rows.push([r.nr||"",r.name,r.supplier||order.supplier||"",r.unit,r.qty,r.address||order.address||"",zinLabel]);
            });
            const ws=XL.utils.aoa_to_sheet(rows);
            ws["!cols"]=[{wch:8},{wch:50},{wch:25},{wch:12},{wch:10},{wch:35},{wch:50}];
            XL.utils.book_append_sheet(wb,ws,"Užsakymas");
            XL.writeFile(wb,("Uzsakymas_"+(order.title||order.id)).replace(/[^\w]/g,"_")+".xlsx");
          }

          async function exportOrderPDF(order) {
            setExportingPdf(true);
            try {
              const container = document.createElement("div");
              container.style.cssText="position:fixed;left:-9999px;top:0;width:1122px;background:white;font-family:Arial,sans-serif;padding:0;";
              document.body.appendChild(container);
              const prog = calcOrderProgress(order);
              const rowsHtml = (order.rows||[]).map((r,ri)=>{
                const zinG=allZinGroups.find(g=>g.id==r.zinGroupId);
                const zinI=allZinItems.find(it=>it.id==r.zinItemId);
                const zinLabel=zinG?(zinG.groupName+(zinI?" / "+zinI.name:"")):(r.zinGroupName?(r.zinGroupName+(r.zinItemName?" / "+r.zinItemName:"")):"—");
                const bg=ri%2===0?"#fff":"#fff7f0";
                return `<tr style="background:${bg}">

                  <td style="padding:7px 6px;border:1px solid #e5e7eb;font-size:12px;word-break:break-word">${zinLabel}</td>
                </tr>`;
              }).join("");
              container.innerHTML=`<div style="padding:0">
                <div style="background:#ea580c;padding:18px 24px 14px;color:white">
                  <div style="font-size:22px;font-weight:bold">UŽSAKYMAS</div>
                  <div style="font-size:14px;margin-top:4px">${order.title||""}</div>
                  <div style="font-size:11px;margin-top:6px;opacity:0.85">Užsakymo data: ${order.date} | Užsakė: ${order.orderedBy||"—"} | Tiekėjas: ${order.supplier||"—"}</div>
                </div>
                <div style="background:#fff7ed;border-left:4px solid #ea580c;margin:16px 16px 0;padding:12px 16px;border-radius:6px">
                  <div style="font-weight:bold;color:#9a3412;font-size:12px;margin-bottom:6px">Užsakymo informacija</div>
                  <div style="display:grid;grid-template-columns:1fr 1fr;gap:4px;font-size:12px">
                    <div><span style="color:#6b7280">Tiekėjas: </span><strong>${order.supplier||"—"}</strong></div>
                    <div><span style="color:#6b7280">Įvykdymas: </span><strong style="color:${prog>=100?"#16a34a":"#ea580c"}">${prog}%</strong></div>
                    <div><span style="color:#6b7280">Pristatymo adresas: </span><strong>${order.address||"—"}</strong></div>
                    <div><span style="color:#6b7280">Statusas: </span><strong>${order.status==="ivykdytas"?"Įvykdytas":"Aktyvus"}</strong></div>
                  </div>
                </div>
                <div style="margin:14px 16px 0">
                  <table style="width:100%;border-collapse:collapse;table-layout:auto">
                    <thead><tr style="background:#ea580c;color:white">
                      <th style="padding:8px 6px;font-size:12px;border:1px solid #c2410c">Nr.</th>
                      <th style="padding:8px 8px;font-size:12px;border:1px solid #c2410c;text-align:left">Prekės pavadinimas</th>
                      <th style="padding:8px 6px;font-size:12px;border:1px solid #c2410c;text-align:left">Tiekėjas</th>
                      <th style="padding:8px 6px;font-size:12px;border:1px solid #c2410c">Vnt.</th>
                      <th style="padding:8px 6px;font-size:12px;border:1px solid #c2410c">Kiekis</th>
                      <th style="padding:8px 6px;font-size:12px;border:1px solid #c2410c;text-align:left">Pristatymo adresas</th>
                      <th style="padding:8px 6px;font-size:12px;border:1px solid #c2410c;text-align:left">Žiniaraštis (gr./poz.)</th>
                    </tr></thead>
                    <tbody>${rowsHtml}</tbody>
                  </table>
                </div>
                <div style="margin:24px 16px 16px;padding-top:12px;border-top:1px solid #e5e7eb">
                  <div style="font-size:13px;font-weight:bold">Užsakovas: Tomas Slepčenko</div>
                  <div style="font-size:10px;color:#9ca3af;margin-top:3px">Dokumentas sugeneruotas: ${todayStr}</div>
                </div>
              </div>`;
              await new Promise(r=>setTimeout(r,120));
              const canvas=await html2canvas(container,{scale:2,useCORS:true,logging:false,backgroundColor:"#ffffff"});
              document.body.removeChild(container);
              const {jsPDF}=window.jspdf;
              const imgW=canvas.width; const imgH=canvas.height;
              const pdfW=297; const ratio=pdfW/(imgW/2);
              const finalH=(imgH/2)*ratio;
              const orientation=finalH>210?"portrait":"landscape";
              const pdf=new jsPDF({orientation,unit:"mm",format:finalH>297?[pdfW,finalH]:"a4"});
              const pw=pdf.internal.pageSize.getWidth(); const ph=pdf.internal.pageSize.getHeight();
              if(finalH<=ph){
                pdf.addImage(canvas.toDataURL("image/png"),"PNG",0,0,pw,finalH);
              } else {
                const pageH_px=(ph/ratio)*2; let srcY=0; let first=true;
                while(srcY<imgH){
                  if(!first) pdf.addPage(); first=false;
                  const sliceH=Math.min(pageH_px,imgH-srcY);
                  const c2=document.createElement("canvas"); c2.width=imgW; c2.height=sliceH;
                  c2.getContext("2d").drawImage(canvas,0,srcY,imgW,sliceH,0,0,imgW,sliceH);
                  pdf.addImage(c2.toDataURL("image/png"),"PNG",0,0,pw,(sliceH/2)*ratio);
                  srcY+=pageH_px;
                }
              }
              pdf.save(("Uzsakymas_"+(order.title||order.id)).replace(/[^\w]/g,"_")+".pdf");

                      {sortDir==="asc"?"A → Z ↑":sortDir==="desc"?"Z → A ↓":"A–Z"}
                    </button>
                    {sortDir!=="none" && <button onClick={()=>setSortDir("none")} className="text-xs text-gray-400 hover:text-red-500">✕</button>}
                  </div>

                  {/* Rezultatų skaičius */}
                  {(searchText.trim() || dateFilter!=="all") && (

                            </div>

                      </div>

                      {/* Pozicijų lentelė */}

                      <div className="border border-gray-200 rounded-xl flex flex-col flex-1 min-h-0 overflow-hidden">
                        <div className="bg-stone-50 px-4 py-2 border-b border-gray-200 flex items-center justify-between flex-shrink-0">
